<!DOCTYPE html>
<!-- v1.0.1 -->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Personal Life Operating System — Track, Analyse, Understand, Improve">
  <title>Life OS — Personal Life Operating System</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f7;--bg2:#e8eaf2;--card:#fff;--sidebar:#16192a;--sidebar2:#1e2240;
  --text:#111827;--text2:#374151;--muted:#6b7280;--xs:#9ca3af;
  --border:#e5e7eb;--border2:#f3f4f6;--input:#f8fafc;
  --primary:#6366f1;--primary-h:#4f46e5;--primary-l:#eef2ff;--primary-t:rgba(99,102,241,.12);
  --success:#10b981;--success-l:#d1fae5;--success-t:rgba(16,185,129,.12);
  --warn:#f59e0b;--warn-l:#fef3c7;--warn-t:rgba(245,158,11,.12);
  --danger:#ef4444;--danger-l:#fee2e2;--danger-t:rgba(239,68,68,.12);
  --info:#3b82f6;--info-l:#dbeafe;
  --r:14px;--r-sm:8px;--r-xs:5px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --sh-md:0 4px 16px rgba(0,0,0,.09);
  --t:.2s ease;
  --sw:250px;--bnav:64px;
}
[data-theme=dark]{
  --bg:#0b0d18;--bg2:#111320;--card:#151829;--sidebar:#0d0f1c;--sidebar2:#16192e;
  --text:#f1f5f9;--text2:#cbd5e1;--muted:#64748b;--xs:#475569;
  --border:#1e2235;--border2:#151829;--input:#1a1d30;
  --primary-l:#1e2256;--success-l:#064e3b;--warn-l:#451a03;--danger-l:#450a0a;--info-l:#1e3a5f;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;transition:background var(--t),color var(--t);}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;}
input,select,textarea{font:inherit;color:inherit;}

/* LAYOUT */
#app{display:flex;min-height:100vh;}
#sidebar{width:var(--sw);background:var(--sidebar);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:200;transition:transform var(--t);}
#main{margin-left:var(--sw);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
#content{flex:1;padding:28px;max-width:1200px;}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}

/* SIDEBAR */
.sb-brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.06);}
.sb-logo{width:34px;height:34px;background:var(--primary);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.sb-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px;}
.sb-ver{font-size:10px;color:rgba(255,255,255,.3);margin-top:1px;}
#sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
.sb-section{padding:8px 20px 4px;font-size:10px;font-weight:600;color:rgba(255,255,255,.25);letter-spacing:.8px;text-transform:uppercase;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:rgba(255,255,255,.5);font-size:13.5px;font-weight:500;transition:all var(--t);border-left:3px solid transparent;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);}
.sb-item.active{background:rgba(99,102,241,.15);color:#fff;border-left-color:var(--primary);}
.sb-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.sb-bottom{padding:12px 20px 16px;border-top:1px solid rgba(255,255,255,.06);}
.sb-user{display:flex;align-items:center;gap:10px;}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.sb-uname{font-size:13px;font-weight:600;color:#fff;}
.sb-uemail{font-size:11px;color:rgba(255,255,255,.35);}
/* Sidebar global date selector */
.sb-date-wrap{margin-bottom:14px;padding:10px 12px;background:rgba(255,255,255,.05);border-radius:10px;}
.sb-date-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}
.sb-date-row{display:flex;align-items:center;gap:5px;}
.sb-date-adj{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;flex-shrink:0;}
.sb-date-adj:hover{background:rgba(255,255,255,.15);}
.sb-date-adj:disabled{opacity:.3;cursor:default;}
.sb-date-input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:7px;color:#fff;padding:4px 7px;font-size:12px;font-weight:600;min-width:0;cursor:pointer;}
.sb-date-input::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.5);}
.sb-today-btn{margin-top:6px;width:100%;padding:4px 0;background:rgba(99,102,241,.25);border:none;border-radius:6px;color:var(--primary);font-size:11px;font-weight:700;cursor:pointer;display:none;}
.sb-today-btn.visible{display:block;}
/* Topbar date chip */
.topbar-date-chip{display:flex;align-items:center;gap:5px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);border-radius:8px;padding:5px 10px;cursor:pointer;position:relative;}
.topbar-date-chip span{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;}
.topbar-date-chip input[type=date]{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;cursor:pointer;}

/* TOPBAR (mobile) */
#topbar{display:none;align-items:center;justify-content:space-between;padding:0 16px;height:54px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:700;}
.btn-menu{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);}
.btn-checkin-sm{background:var(--primary);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;}

/* BOTTOM NAV */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bnav);background:var(--card);border-top:1px solid var(--border);z-index:100;flex-direction:row;justify-content:space-around;align-items:center;padding:0 8px;}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;padding:6px 4px;border-radius:10px;color:var(--muted);transition:color var(--t);}
.bnav-item.active{color:var(--primary);}
.bnav-icon{font-size:20px;line-height:1;}
.bnav-label{font-size:10px;font-weight:500;}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;transition:box-shadow var(--t);}
.card-sm{padding:14px 16px;}
.card-hover:hover{box-shadow:var(--sh-md);}
.card-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.card-heading{font-size:17px;font-weight:700;margin-bottom:4px;}

/* GRID */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}

/* STAT CARD */
.stat-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;display:flex;flex-direction:column;gap:4px;}
.stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text);}
.stat-sub{font-size:12px;color:var(--muted);}
.stat-icon{font-size:20px;margin-bottom:4px;}
.stat-bar{height:4px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden;}
.stat-fill{height:100%;border-radius:2px;transition:width .5s ease;}

/* SCORE */
.score-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-num{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1;}
.score-label{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px;}
.score-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;}

/* PROGRESS */
.progress-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease;}
.progress-sm{height:5px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px;transition:all var(--t);cursor:pointer;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-h);}
.btn-secondary{background:var(--bg2);color:var(--text2);}
.btn-secondary:hover{background:var(--border);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:transparent;color:var(--muted);padding:6px 10px;}
.btn-ghost:hover{background:var(--bg2);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-lg{padding:12px 24px;font-size:15px;}
.btn-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);}
.btn-icon:hover{background:var(--bg2);}
.btn-block{width:100%;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* QUICK ADD BTNS */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border-radius:var(--r);background:var(--card);box-shadow:var(--sh);transition:all var(--t);cursor:pointer;border:2px solid transparent;}
.quick-btn:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--sh-md);}
.quick-btn .q-icon{font-size:22px;}
.quick-btn .q-label{font-size:11px;font-weight:600;color:var(--muted);}

/* WATER BUTTONS */
.water-btns{display:flex;gap:8px;flex-wrap:wrap;}
.water-btn{padding:9px 16px;border-radius:var(--r-sm);background:var(--info-l);color:var(--info);font-weight:700;font-size:13px;transition:all var(--t);}
.water-btn:hover{background:var(--info);color:#fff;}
.water-display{font-size:48px;font-weight:900;color:var(--info);letter-spacing:-2px;}
.water-glasses{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0;}
.glass{font-size:24px;transition:all var(--t);}

/* FORM ELEMENTS */
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
label.form-label{font-size:12px;font-weight:600;color:var(--muted);}
.form-control{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--input);font-size:13.5px;transition:border var(--t),box-shadow var(--t);width:100%;}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-t);}
select.form-control{cursor:pointer;}
textarea.form-control{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* RANGE SLIDER */
.range-wrap{display:flex;flex-direction:column;gap:6px;}
.range-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--border);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);box-shadow:0 1px 4px rgba(99,102,241,.4);}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--primary);border:none;}

/* TOGGLE */
.toggle-wrap{display:flex;align-items:center;gap:8px;}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:11px;cursor:pointer;transition:var(--t);}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:var(--t);}
.toggle input:checked+.toggle-slider{background:var(--primary);}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px);}

/* CHECKBOX */
.check-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);transition:background var(--t);cursor:pointer;}
.check-item:hover{background:var(--bg2);}
.check-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;}
.check-item.done span{text-decoration:line-through;color:var(--muted);}

/* STAR RATING */
.star-rating{display:flex;gap:2px;}
.star{cursor:pointer;font-size:22px;color:var(--border);transition:color var(--t);}
.star.filled{color:var(--warn);}
.star:hover,.star:hover~.star{color:var(--warn);}
.dot-rating{display:flex;gap:5px;}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:all var(--t);}
.dot.active{background:var(--primary);border-color:var(--primary);}

/* TAGS */
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;}
.tag-primary{background:var(--primary-l);color:var(--primary);}
.tag-success{background:var(--success-l);color:var(--success);}
.tag-warn{background:var(--warn-l);color:var(--warn);}
.tag-danger{background:var(--danger-l);color:var(--danger);}
.tag-muted{background:var(--bg2);color:var(--muted);}

/* TASKS */
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--card);border-radius:var(--r-sm);box-shadow:var(--sh);margin-bottom:8px;transition:all var(--t);}
.task-item.done .task-title{text-decoration:line-through;color:var(--muted);}
.task-check{width:20px;height:20px;border-radius:5px;border:2.5px solid var(--border);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--t);}
.task-check.checked{background:var(--success);border-color:var(--success);color:#fff;}
.task-title{font-size:13.5px;font-weight:500;flex:1;}
.task-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.task-actions{display:flex;gap:4px;opacity:0;transition:opacity var(--t);}
.task-item:hover .task-actions{opacity:1;}
.priority-h{border-left:3px solid var(--danger);}
.priority-m{border-left:3px solid var(--warn);}
.priority-l{border-left:3px solid var(--success);}

/* HABIT ITEMS */
.habit-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:var(--r-sm);box-shadow:var(--sh);margin-bottom:8px;}
.habit-check{width:24px;height:24px;border-radius:6px;border:2.5px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all var(--t);}
.habit-check.done{background:var(--success);border-color:var(--success);color:#fff;}
.habit-info{flex:1;}
.habit-name{font-size:13.5px;font-weight:500;}
.habit-streak{font-size:11px;color:var(--warn);font-weight:600;}

/* SECTION HEADERS */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title{font-size:17px;font-weight:700;letter-spacing:-.2px;}
.section-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.page-header{margin-bottom:24px;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.4px;}
.page-sub{font-size:13px;color:var(--muted);margin-top:3px;}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:16px 0;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.empty-sub{font-size:13px;}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
#modal-overlay.hidden{display:none;}
#modal-box{background:var(--card);border-radius:var(--r);max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-md);animation:slideUp .2s ease;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0;}
.modal-title{font-size:17px;font-weight:700;}
.modal-close{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;}
.modal-close:hover{background:var(--bg2);}
.modal-body{padding:20px;}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;z-index:600;opacity:0;transition:opacity .3s;pointer-events:none;}
#toast.show{opacity:1;}

/* CHECK-IN WIZARD */
.wizard-progress{display:flex;gap:4px;margin-bottom:24px;}
.wizard-step{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s;}
.wizard-step.done{background:var(--primary);}
.wizard-step.active{background:var(--primary-l);}
.wizard-nav{display:flex;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
.step-title{font-size:22px;font-weight:800;margin-bottom:4px;}
.step-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}

/* ROUTINE CHECKLIST */
.routine-habit{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--t);}
.routine-habit:hover{background:var(--bg2);}
.routine-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all var(--t);}
.routine-check.done{background:var(--success);border-color:var(--success);color:#fff;}
.routine-name{font-size:13.5px;font-weight:500;}
.routine-score{font-size:36px;font-weight:900;letter-spacing:-1px;}

/* EXERCISE LOG */
.exercise-item{padding:12px 14px;background:var(--bg2);border-radius:var(--r-sm);margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.exercise-icon{font-size:20px;}
.exercise-info{flex:1;}
.exercise-name{font-size:13.5px;font-weight:600;}
.exercise-meta{font-size:11px;color:var(--muted);}
.break-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:var(--success-l);color:var(--success);border-radius:99px;font-size:12px;font-weight:600;margin:4px;}

/* CHARTS */
.chart-wrap{position:relative;height:220px;}
.chart-wrap-lg{position:relative;height:280px;}

/* ANALYTICS */
.period-selector{display:flex;gap:6px;background:var(--bg2);border-radius:var(--r-sm);padding:4px;}
.period-btn{padding:5px 14px;border-radius:var(--r-xs);font-size:12px;font-weight:600;color:var(--muted);transition:all var(--t);}
.period-btn.active{background:var(--card);color:var(--text);box-shadow:var(--sh);}

/* HEATMAP */
.heatmap{display:flex;gap:3px;flex-wrap:wrap;}
.heatmap-day{width:13px;height:13px;border-radius:2px;background:var(--border);}
.heatmap-day.l1{background:rgba(99,102,241,.2);}
.heatmap-day.l2{background:rgba(99,102,241,.45);}
.heatmap-day.l3{background:rgba(99,102,241,.7);}
.heatmap-day.l4{background:var(--primary);}

/* GOAL CARD */
.goal-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:10px;}
.goal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.goal-title{font-size:14px;font-weight:700;}
.goal-meta{font-size:11px;color:var(--muted);}
.goal-pct{font-size:18px;font-weight:800;color:var(--primary);}

/* BOOK CARD */
.book-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;gap:14px;}
.book-spine{width:8px;border-radius:2px;flex-shrink:0;}
.book-info{flex:1;}
.book-title{font-size:14px;font-weight:700;}
.book-author{font-size:12px;color:var(--muted);}

/* REVIEW */
.review-area{background:var(--warn-l);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;}
.review-good{background:var(--success-l);}
.review-bad{background:var(--danger-l);}

/* FOOD LOG */
.meal-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:8px;}
.meal-type{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.meal-desc{font-size:14px;font-weight:500;margin:3px 0;}
.meal-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}

/* SETTINGS */
.settings-section{margin-bottom:28px;}
.settings-title{font-size:15px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border2);}
.setting-row:last-child{border-bottom:none;}
.setting-label{font-size:13.5px;font-weight:500;}
.setting-sub{font-size:11px;color:var(--muted);}

/* MISC */
.text-muted{color:var(--muted);}
.text-sm{font-size:12px;}
.text-xs{font-size:11px;}
.text-primary{color:var(--primary);}
.text-success{color:var(--success);}
.text-warn{color:var(--warn);}
.text-danger{color:var(--danger);}
.font-bold{font-weight:700;}
.font-semibold{font-weight:600;}
.mt-1{margin-top:4px;}.mt-2{margin-top:8px;}.mt-3{margin-top:12px;}.mt-4{margin-top:16px;}.mt-6{margin-top:24px;}
.mb-1{margin-bottom:4px;}.mb-2{margin-bottom:8px;}.mb-3{margin-bottom:12px;}.mb-4{margin-bottom:16px;}
.flex{display:flex;}.flex-col{flex-direction:column;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}.gap-2{gap:8px;}.gap-3{gap:12px;}.flex-1{flex:1;}
.hidden{display:none!important;}

/* ANIMATIONS */
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.anim-fade{animation:fadeIn .3s ease;}
.anim-slide{animation:slideUp .3s ease;}

/* RESPONSIVE */
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay.open{display:block;}
  #main{margin-left:0;}
  #topbar{display:flex;}
  #bottom-nav{display:flex;}
  #content{padding:16px 14px calc(var(--bnav) + 20px);}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  .form-row,.form-row-3{grid-template-columns:1fr;}
  .score-num{font-size:40px;}
  .quick-grid{grid-template-columns:repeat(4,1fr);}
}
@media(max-width:480px){
  .quick-grid{grid-template-columns:repeat(3,1fr);}
  .water-btns{gap:6px;}
  .water-btn{padding:8px 12px;font-size:12px;}
}

/* LOCK SCREEN */
#lock-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0d0f1c 0%,#16192e 50%,#0d0f1c 100%);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;}
#lock-screen.hidden{display:none;}
.lock-card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:40px 36px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.lock-logo{width:60px;height:60px;background:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;box-shadow:0 8px 24px rgba(99,102,241,.4);}
.lock-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;}
.lock-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:28px;}
.lock-input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:13px 16px;font-size:16px;color:#fff;text-align:center;letter-spacing:3px;outline:none;transition:border-color .2s;}
.lock-input:focus{border-color:var(--primary);}
.lock-input::placeholder{letter-spacing:0;color:rgba(255,255,255,.3);}
.lock-btn{width:100%;margin-top:14px;background:var(--primary);color:#fff;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:background .2s,transform .1s;}
.lock-btn:hover{background:var(--primary-h);}
.lock-btn:active{transform:scale(.98);}
.lock-error{color:#f87171;font-size:13px;margin-top:10px;min-height:18px;}
.lock-footer{margin-top:24px;font-size:12px;color:rgba(255,255,255,.2);}
@keyframes lockShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.lock-shake{animation:lockShake .3s ease;}

// PART 1: Config, Storage, Utils, Score Engine
'use strict';

const Utils = {
  today(){ return new Date().toISOString().slice(0,10); },
  now(){ return new Date().toTimeString().slice(0,5); },
  fmtDate(d){ if(!d)return''; const dt=new Date(d+'T12:00:00'); return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); },
  fmtDay(d){ if(!d)return''; const dt=new Date(d+'T12:00:00'); return dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); },
  dayName(){ return new Date().toLocaleDateString('en-GB',{weekday:'long'}); },
  greeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; },
  uid(){ return Math.random().toString(36).slice(2,10); },
  pct(v,t){ if(!t)return 0; return Math.min(100,Math.round((v/t)*100)); },
  clamp(v,min,max){ return Math.min(max,Math.max(min,v)); },
  avg(arr){ if(!arr.length)return 0; return arr.reduce((s,v)=>s+v,0)/arr.length; },
  round1(v){ return Math.round(v*10)/10; },
  streak(logs, check){ 
    let s=0,d=new Date();
    for(let i=0;i<365;i++){
      const key=d.toISOString().slice(0,10);
      const log=logs.find(l=>l.date===key);
      if(log&&check(log)) s++;
      else if(i>0) break;
      d.setDate(d.getDate()-1);
    }
    return s;
  },
  escape(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },
  stars(v,max=5){ let s=''; for(let i=1;i<=max;i++) s+=`<span class="star ${i<=v?'filled':''}" style="font-size:18px">${i<=v?'★':'☆'}</span>`; return s; },
  ratingDots(v,max=5){ let s=''; for(let i=1;i<=max;i++) s+=`<span class="dot ${i<=v?'active':''}" data-v="${i}"></span>`; return s; },
};

const Score = {
  calc(log, settings){
    const w = settings.scoreWeights;
    const s = {};
    
    // Health (weight, sleep, energy, steps, water)
    let hpts=0, hmax=0;
    if(log.weight!==null){hpts+=20;hmax+=20;}
    if(log.sleep!==null){ const q=log.sleep>=7&&log.sleep<=9?20:log.sleep>=6?14:8; hpts+=q; hmax+=20; }
    if(log.energy!==null){ hpts+=log.energy*4; hmax+=20; }
    if(log.steps!==null){ hpts+=Math.min(20,Math.round((log.steps/settings.stepGoal)*20)); hmax+=20; }
    if(log.water){ hpts+=Math.min(20,Math.round((log.water/settings.waterGoal)*20)); hmax+=20; }
    s.health = hmax?Math.round((hpts/hmax)*100):50;

    // Mindset (mood, stress, focus, meditation)
    let mpts=0, mmax=0;
    if(log.mood!==null){ mpts+=log.mood*20; mmax+=100; }
    if(log.stress!==null){ mpts+=(6-log.stress)*20; mmax+=100; }
    if(log.focus!==null){ mpts+=log.focus*20; mmax+=100; }
    if(log.meditated){ mpts+=Math.min(100,Math.round((log.meditationDuration/settings.meditationGoal)*100)); mmax+=100; }
    s.mindset = mmax?Math.round((mpts/mmax)*100):50;

    // Exercise
    let epts=0;
    if(log.exercised && log.exercises && log.exercises.length){
      const totalMin=log.exercises.reduce((sum,e)=>sum+(e.duration||0),0);
      epts=Math.min(100,Math.round((totalMin/settings.exerciseGoal)*100));
    } else if(log.steps&&log.steps>=settings.stepGoal){ epts=60; }
    s.exercise = epts || (log.exercised===false?0:50);

    // Nutrition
    if(log.meals&&log.meals.length){
      const healthy=log.meals.filter(m=>m.isHealthy).length;
      const junk=log.meals.filter(m=>m.isJunk).length;
      const ratio=healthy/(log.meals.length);
      s.nutrition=Math.round((ratio*70)+(log.water>=settings.waterGoal?30:Math.round((log.water/settings.waterGoal)*30)));
    } else { s.nutrition=50; }

    // Morning routine
    const mh = settings.morningHabits.filter(h=>h.enabled);
    if(mh.length&&Object.keys(log.morningRoutine).length){
      const done=mh.filter(h=>log.morningRoutine[h.id]).length;
      s.morningRoutine=Math.round((done/mh.length)*100);
    } else { s.morningRoutine=50; }

    // Evening routine
    const eh = settings.eveningHabits.filter(h=>h.enabled);
    if(eh.length&&Object.keys(log.eveningRoutine).length){
      const done=eh.filter(h=>log.eveningRoutine[h.id]).length;
      s.eveningRoutine=Math.round((done/eh.length)*100);
    } else { s.eveningRoutine=50; }

    // Learning
    if(log.learningMinutes!==null){ s.learning=Math.min(100,Math.round((log.learningMinutes/settings.learningGoal)*100)); }
    else { s.learning=50; }

    // Relationships
    s.relationships = log.connection?100:(log.familyTime?60:30);

    // Tasks
    const tasks=DB.tasks().filter(t=>t.dueDate===Utils.today()||t.status==='in_progress');
    if(tasks.length){ const done=tasks.filter(t=>t.status==='completed').length; s.tasks=Math.round((done/tasks.length)*100); }
    else { s.tasks=70; }

    // Weighted total
    const total=Math.round(
      (s.health*(w.health/100))+
      (s.mindset*(w.mindset/100))+
      (s.exercise*(w.exercise/100))+
      (s.nutrition*(w.nutrition/100))+
      (s.morningRoutine*(w.morningRoutine/100))+
      (s.eveningRoutine*(w.eveningRoutine/100))+
      (s.learning*(w.learning/100))+
      (s.relationships*(w.relationships/100))+
      (s.tasks*(w.tasks/100))
    );
    return { total, breakdown:s };
  },
  color(v){ return v>=80?'var(--success)':v>=60?'var(--warning)':'var(--danger)'; },
  grade(v){ return v>=90?'A+':v>=80?'A':v>=70?'B':v>=60?'C':'D'; },
};

function updateGlobalDateDisplay() {
  const today = Utils.today();
  const d = App.state.entryDate || today;
  const isToday = d === today;

  // Format label
  let label;
  if (isToday) {
    label = '📅 Today';
  } else {
    const parts = d.split('-');
    const dt = new Date(+parts[0], +parts[1]-1, +parts[2]);
    label = '📅 ' + dt.toLocaleDateString('en-US', {month:'short', day:'numeric', year: dt.getFullYear()!==new Date().getFullYear()?'numeric':undefined});
  }

  // Topbar chip
  const topbarLabel = document.getElementById('topbar-date-label');
  const topbarInput = document.getElementById('topbar-date-input');
  if (topbarLabel) topbarLabel.textContent = label;
  if (topbarInput) { topbarInput.max = today; topbarInput.value = d; }

  // Sidebar selectors
  const sbInput = document.getElementById('sb-date-input');
  const sbNext = document.getElementById('sb-date-next');
  const sbTodayBtn = document.getElementById('sb-today-btn');
  if (sbInput) { sbInput.max = today; sbInput.value = d; }
  if (sbNext) sbNext.disabled = isToday;
  if (sbTodayBtn) { sbTodayBtn.classList.toggle('visible', !isToday); }
}

function setEntryDate(date) {
  const today = Utils.today();
  // clamp to today at the latest
  if (date && date > today) date = today;
  App.state.entryDate = date || today;
  updateGlobalDateDisplay();
  App.navigate(App.state.view);
}

function globalDateAdj(n) {
  const today = Utils.today();
  const cur = App.state.entryDate || today;
  const parts = cur.split('-');
  const dt = new Date(+parts[0], +parts[1]-1, +parts[2]);
  dt.setDate(dt.getDate() + n);
  const newDate = dt.toISOString().slice(0,10);
  if (newDate > today) return;
  setEntryDate(newDate);
}

function miniRing(pct, color, sz) {
  sz = sz || 48;
  var r = sz/2 - 5;
  var c = +(2 * Math.PI * r).toFixed(1);
  var off = +(c - (c * Math.min(100, pct || 0) / 100)).toFixed(1);
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" style="transform:rotate(-90deg);display:block"><circle cx="'+(sz/2)+'" cy="'+(sz/2)+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="4.5"/><circle cx="'+(sz/2)+'" cy="'+(sz/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="4.5" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>';
}

function viewDashboard() {
  const log = DB.todayLog();
  const settings = DB.settings();
  const score = Score.calc(log, settings);
  if (log.score !== score.total) { log.score = score.total; log.scoreBreakdown = score.breakdown; DB.saveTodayLog(log); }

  const allLogs = DB.recentLogs(7);
  const prevScore = allLogs.length > 1 ? (allLogs[allLogs.length-2]?.score||0) : 0;
  const scoreDiff = score.total - prevScore;
  const scoreDiffStr = scoreDiff > 0 ? `<span class="text-success">↑ ${scoreDiff}pts</span>` : scoreDiff < 0 ? `<span class="text-danger">↓ ${Math.abs(scoreDiff)}pts</span>` : `<span class="text-muted">→ Stable</span>`;

  const tasks = DB.tasks().filter(t => t.status !== 'completed' && t.status !== 'cancelled');
  const todayTasks = tasks.filter(t => !t.dueDate || t.dueDate === Utils.today()).slice(0, 5);
  const overdueTasks = tasks.filter(t => t.dueDate && t.dueDate < Utils.today());

  const mh = settings.morningHabits.filter(h=>h.enabled);
  const mDone = mh.filter(h=>log.morningRoutine[h.id]).length;
  const eh = settings.eveningHabits.filter(h=>h.enabled);
  const eDone = eh.filter(h=>log.eveningRoutine[h.id]).length;

  const waterPct = Utils.pct(log.water, settings.waterGoal);
  const stepPct = Utils.pct(log.steps||0, settings.stepGoal);
  const scoreColor = Score.color(score.total);

  const scoreGrad = score.total >= 75 ? '#10b981' : score.total >= 50 ? '#f59e0b' : '#ef4444';

  // Week strip data
  const weekDays = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0,10);
    const wl = allLogs.find(l => l.date === ds);
    weekDays.push({ ds, label: d.toLocaleDateString('en-GB',{weekday:'short'}), score: wl?.score||0, hasData: !!wl, isToday: i===0 });
  }
  const avgScore = weekDays.filter(d=>d.hasData).length ? Math.round(weekDays.filter(d=>d.hasData).reduce((s,d)=>s+d.score,0)/weekDays.filter(d=>d.hasData).length) : score.total;

  // Smart insight
  const insights = [];
  if (!log.water || log.water < 2) insights.push({icon:'💧', msg:'Start hydrating — you\'ve had very little water today.', color:'var(--info)', nav:'water'});
  if (!log.exercises || !log.exercises.length) insights.push({icon:'🏃', msg:'No exercise logged yet — even a 15-min walk counts!', color:'var(--success)', nav:'exercise'});
  if (!log.sleep) insights.push({icon:'😴', msg:'Log last night\'s sleep to improve your score.', color:'#8b5cf6', nav:'mindset'});
  if (!log.mood) insights.push({icon:'🎯', msg:'Quick check-in: how\'s your mood & energy today?', color:'var(--primary)', nav:'mindset'});
  if (waterPct >= 100 && log.exercises?.length && log.sleep) insights.push({icon:'🌟', msg:'Amazing — water, sleep & exercise all done! Keep it up.', color:'var(--success)', nav:null});
  const topInsight = insights[0] || {icon:'✨', msg:'Log your water, exercise, or mood to track progress.', color:'var(--primary)', nav:'water'};

  // Habit streaks
  const streakData = [
    { label:'Water', icon:'💧', streak: (() => { let s=0; for(let i=allLogs.length-1;i>=0;i--){ const l=allLogs[i]; if((l.water||0)>=(settings.waterGoal||8)){s++;}else break;} return s; })(), color:'var(--info)' },
    { label:'Exercise', icon:'🏃', streak: (() => { let s=0; for(let i=allLogs.length-1;i>=0;i--){ const l=allLogs[i]; if(l.exercised||l.exercises?.length){s++;}else break;} return s; })(), color:'var(--success)' },
    { label:'Meditation', icon:'🧘', streak: (() => { let s=0; for(let i=allLogs.length-1;i>=0;i--){ const l=allLogs[i]; if(l.meditated){s++;}else break;} return s; })(), color:'var(--primary)' },
    { label:'Sleep', icon:'😴', streak: (() => { let s=0; for(let i=allLogs.length-1;i>=0;i--){ const l=allLogs[i]; if(l.sleep){s++;}else break;} return s; })(), color:'#8b5cf6' },
  ];

  return `<div class="anim-fade">
  <!-- Header -->
  <div style="margin-bottom:16px">
    <div style="font-size:13px;color:var(--muted);font-weight:500;margin-bottom:3px">${Utils.dayName()}, ${Utils.fmtDate(Utils.today())}</div>
    <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px">${Utils.greeting()}, ${Utils.escape(settings.name||'there')} 👋</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:5px 14px 5px 10px;box-shadow:var(--sh)">
        <span style="font-size:14px">📊</span>
        <span style="font-size:12px;font-weight:700;color:var(--text)">Score: </span>
        <span style="font-size:12px;font-weight:800;color:${scoreColor}">${score.total}</span>
        <span style="font-size:11px;color:var(--muted)">/100</span>
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:5px 14px 5px 10px;box-shadow:var(--sh)">
        <span style="font-size:14px">💧</span>
        <span style="font-size:12px;font-weight:700;color:var(--text)">Water: </span>
        <span style="font-size:12px;font-weight:800;color:var(--info)">${log.water}/${settings.waterGoal}</span>
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:5px 14px 5px 10px;box-shadow:var(--sh)">
        <span style="font-size:14px">📋</span>
        <span style="font-size:12px;font-weight:700;color:var(--text)">Tasks: </span>
        <span style="font-size:12px;font-weight:800;color:var(--primary)">${todayTasks.length} pending</span>
      </div>
      ${overdueTasks.length ? `<div style="display:inline-flex;align-items:center;gap:6px;background:var(--danger-l);border:1px solid rgba(239,68,68,.2);border-radius:99px;padding:5px 14px 5px 10px;box-shadow:var(--sh)"><span style="font-size:14px">⚠️</span><span style="font-size:12px;font-weight:800;color:var(--danger)">${overdueTasks.length} overdue</span></div>` : ''}
    </div>
  </div>

  <!-- Week At A Glance Strip -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:0;box-shadow:var(--sh)">
    <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;margin-right:14px">This Week</div>
    <div style="display:flex;gap:8px;flex:1;align-items:flex-end;justify-content:center">
      ${weekDays.map(d=>{
        const h = d.hasData ? Math.max(18, Math.round(d.score * 0.48)) : 18;
        const bg = !d.hasData ? 'var(--border)' : d.score>=75?'#10b981':d.score>=50?'#f59e0b':'#ef4444';
        const alpha = d.isToday ? '1' : '0.55';
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px">
          <div style="font-size:9px;font-weight:700;color:${d.isToday?scoreColor:'var(--muted)'}">${d.hasData&&!d.isToday?d.score:d.isToday?score.total:''}</div>
          <div style="width:24px;height:${h}px;border-radius:5px;background:${bg};opacity:${alpha};transition:all .3s;${d.isToday?'box-shadow:0 0 0 2px '+scoreGrad+',0 0 12px rgba(99,102,241,.25)':''}"></div>
          <div style="font-size:9px;font-weight:${d.isToday?800:600};color:${d.isToday?'var(--text)':'var(--muted)'}">${d.label}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-left:14px;text-align:right">
      <div style="font-size:9px;color:var(--muted);font-weight:600">7-DAY AVG</div>
      <div style="font-size:20px;font-weight:900;color:${Score.color(avgScore)};letter-spacing:-1px">${avgScore}</div>
    </div>
  </div>

  <!-- Smart Insight Banner -->
  <div style="background:var(--card);border:1px solid var(--border);border-left:3px solid ${topInsight.color};border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);cursor:${topInsight.nav?'pointer':'default'}" ${topInsight.nav?`onclick="App.navigate('${topInsight.nav}')"`:''}">
    <div style="font-size:22px;flex-shrink:0">${topInsight.icon}</div>
    <div style="flex:1">
      <div style="font-size:11px;font-weight:700;color:${topInsight.color};text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Today's Focus</div>
      <div style="font-size:13px;font-weight:500;color:var(--text2)">${topInsight.msg}</div>
    </div>
    ${topInsight.nav ? `<div style="font-size:18px;color:var(--muted)">›</div>` : ''}
  </div>

  <!-- Score + Quick Add Row -->
  <div class="grid-2" style="margin-bottom:20px">
    <!-- Life Score -->
    <div class="card" style="background:linear-gradient(135deg,var(--card) 0%,var(--bg2) 100%);padding:20px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:16px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Life Score</div>
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <div style="font-size:11px;color:var(--muted)">${scoreDiffStr} from yesterday</div>
      </div>
      <div style="display:flex;align-items:center;gap:20px">
        <!-- Score Ring -->
        <div style="position:relative;width:110px;height:110px;flex-shrink:0">
          <svg class="score-ring-svg" width="110" height="110" viewBox="0 0 110 110">
            <circle class="score-ring-bg" cx="55" cy="55" r="48" fill="none" stroke-width="9"/>
            <circle class="score-ring-fill" cx="55" cy="55" r="48" fill="none" stroke="${scoreGrad}" stroke-width="9" stroke-dasharray="302" style="--dash:${Math.round(302 - (score.total/100)*302)}"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div class="score-num" data-count="${score.total}" style="font-size:36px">${score.total}</div>
            <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">/ 100</div>
          </div>
        </div>
        <!-- Breakdown -->
        <div style="flex:1;min-width:0">
          ${Object.entries(score.breakdown).map(([k,v])=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <div style="font-size:10.5px;color:var(--muted);width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase())}</div>
            <div style="flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden"><div style="height:100%;border-radius:3px;width:${v}%;background:${Score.color(v)};transition:width .6s ease"></div></div>
            <div style="font-size:11px;font-weight:800;color:${Score.color(v)};width:24px;text-align:right">${v}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- Quick Add -->
    <div class="card">
      <div class="card-title">⚡ Quick Add</div>
      <div class="quick-grid">
        <div class="quick-btn" onclick="App.navigate('water')"><div class="q-icon">💧</div><div class="q-label">Water</div></div>
        <div class="quick-btn" onclick="App.navigate('exercise')"><div class="q-icon">🏃</div><div class="q-label">Exercise</div></div>
        <div class="quick-btn" onclick="App.navigate('meditation')"><div class="q-icon">🧘</div><div class="q-label">Meditate</div></div>
        <div class="quick-btn" onclick="App.navigate('food')"><div class="q-icon">🍎</div><div class="q-label">Food</div></div>
        <div class="quick-btn" onclick="showAddExpense()"><div class="q-icon">💰</div><div class="q-label">Expense</div></div>
        <div class="quick-btn" onclick="App.navigate('learning')"><div class="q-icon">📚</div><div class="q-label">Learning</div></div>
        <div class="quick-btn" onclick="App.navigate('reading')"><div class="q-icon">📖</div><div class="q-label">Reading</div></div>
        <div class="quick-btn" onclick="App.navigate('tasks')"><div class="q-icon">☑️</div><div class="q-label">Task</div></div>
        <div class="quick-btn" onclick="App.navigate('mindset')"><div class="q-icon">🧠</div><div class="q-label">Mindset</div></div>
      </div>
    </div>
  </div>

  <!-- Stats Row 1: Health -->
  <div class="section-pill sp-red" style="margin-bottom:10px">❤️ HEALTH TODAY</div>
  <div class="grid-4" style="margin-bottom:20px">

    <!-- Weight -->
    <div class="stat-card metric-card accent-purple" onclick="App.navigate('health')" style="cursor:pointer">
      <div class="mc-top">
        <div>
          <div class="mc-icon-wrap mc-icon-purple">⚖️</div>
          <div class="mc-meta-label">Weight</div>
        </div>
        <span class="mc-badge ${log.weight ? 'mc-badge-done' : 'mc-badge-pending'}">${log.weight ? '✓ Logged' : 'Pending'}</span>
      </div>
      ${log.weight
        ? `<div class="mc-val" data-count="${log.weight}" data-suffix=" kg">${log.weight}<span class="mc-unit"> kg</span></div><div class="mc-context">Log daily to track trend</div>`
        : `<div class="mc-empty-label">Not recorded today</div><div class="mc-cta-hint">↗ Tap to add weight</div>`}
    </div>

    <!-- Steps -->
    <div class="stat-card metric-card accent-blue" onclick="App.navigate('health')" style="cursor:pointer">
      <div class="mc-top">
        <div>
          <div class="mc-icon-wrap mc-icon-blue">👟</div>
          <div class="mc-meta-label">Steps</div>
        </div>
        <div class="mc-ring-wrap">${miniRing(stepPct, 'var(--info)', 48)}<div class="mc-ring-label" style="color:var(--info)">${stepPct}%</div></div>
      </div>
      ${log.steps
        ? `<div class="mc-val" data-count="${log.steps}">${log.steps.toLocaleString()}</div><div class="mc-context">${stepPct}% of ${settings.stepGoal.toLocaleString()} goal</div>`
        : `<div class="mc-empty-label">Not tracked today</div><div class="mc-context">Goal: ${settings.stepGoal.toLocaleString()}</div>`}
    </div>

    <!-- Water -->
    <div class="stat-card metric-card accent-blue" onclick="App.navigate('water')" style="cursor:pointer">
      <div class="mc-top">
        <div>
          <div class="mc-icon-wrap mc-icon-blue">💧</div>
          <div class="mc-meta-label">Water</div>
        </div>
        <div class="mc-ring-wrap">${miniRing(waterPct, 'var(--info)', 48)}<div class="mc-ring-label" style="color:var(--info)">${waterPct}%</div></div>
      </div>
      <div class="mc-val"><span data-count="${log.water}">${log.water}</span><span class="mc-unit"> / ${settings.waterGoal} 🥛</span></div>
      <div class="mc-context">${waterPct >= 100 ? '🎉 Goal reached!' : log.water > 0 ? `${settings.waterGoal - log.water} more to go` : 'Start logging intake'}</div>
    </div>

    <!-- Sleep -->
    <div class="stat-card metric-card accent-purple" onclick="App.navigate('mindset')" style="cursor:pointer">
      <div class="mc-top">
        <div>
          <div class="mc-icon-wrap mc-icon-purple">😴</div>
          <div class="mc-meta-label">Sleep</div>
        </div>
        ${log.sleep
          ? `<div class="mc-ring-wrap">${miniRing(Math.min(100, log.sleep / 9 * 100), '#8b5cf6', 48)}<div class="mc-ring-label" style="color:#8b5cf6">${Math.round(log.sleep/9*100)}%</div></div>`
          : `<span class="mc-badge mc-badge-pending">Pending</span>`}
      </div>
      ${log.sleep
        ? `<div class="mc-val" data-count="${log.sleep}" data-suffix="h">${log.sleep}<span class="mc-unit"> hrs</span></div><div class="mc-context">Quality: ${log.sleepQuality ? '⭐'.repeat(log.sleepQuality) : 'not rated'}</div>`
        : `<div class="mc-empty-label">Not logged yet</div><div class="mc-cta-hint">↗ Log last night's sleep</div>`}
    </div>
  </div>

  <!-- Row 2: Mind + Exercise -->
  <div class="grid-2" style="margin-bottom:20px">
    <!-- Mind -->
    <div class="card" onclick="App.navigate('mindset')" style="cursor:pointer">
      <div class="card-title">🧠 Mind & Mood</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        ${[['😊 Mood',log.mood,'var(--primary)'],['⚡ Energy',log.energy,'var(--warn)'],['🎯 Focus',log.focus,'var(--info)'],['😤 Stress',log.stress,'var(--danger)']].map(([l,v,c])=>`
          <div style="padding:10px;background:var(--bg2);border-radius:10px;text-align:center">
            <div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">${l}</div>
            <div style="font-size:22px;font-weight:900;color:${v?c:'var(--muted)'};">${v||'—'}${v?'<span style="font-size:11px;color:var(--muted);font-weight:500"> /5</span>':''}</div>
            ${v ? `<div style="margin-top:5px;height:3px;border-radius:2px;background:var(--border)"><div style="height:100%;border-radius:2px;background:${c};width:${v*20}%;transition:width .7s ease"></div></div>` : ''}
          </div>`).join('')}
      </div>
      ${log.meditated ? `<div class="mt-3" style="padding:8px 12px;background:var(--primary-l);border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--primary)">🧘 ${log.meditationDuration||0} min meditation ✓</div>` : ''}
    </div>

    <!-- Exercise -->
    <div class="card">
      <div class="card-title">🏃 Exercise</div>
      ${log.exercises && log.exercises.length ? log.exercises.map(e=>`
        <div class="exercise-item">
          <div class="exercise-info">
            <div class="exercise-name">${Utils.escape(e.type)}</div>
            <div class="exercise-meta">${e.duration||0} min · ${Utils.escape(e.intensity||'')}</div>
          </div>
        </div>`).join('') : `
        <div style="padding:10px 0">
          <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="App.navigate('exercise')">
            <span style="font-size:20px">🏃</span>
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--text)">No workout logged yet</div>
              <div style="font-size:11px;color:var(--muted)">Tap to log cardio, strength, or yoga</div>
            </div>
            <div style="margin-left:auto;font-size:11px;font-weight:700;color:var(--primary)">Log →</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${['🚶 Walk','🏋️ Gym','🧘 Yoga','🚴 Cycle','🏊 Swim'].map(a=>`<span style="padding:4px 10px;background:var(--primary-t);color:var(--primary);border-radius:20px;font-size:11px;font-weight:600;cursor:pointer" onclick="App.navigate('exercise')">${a}</span>`).join('')}
          </div>
        </div>`}
      ${log.breakExercises && log.breakExercises.length ? `<div style="margin-top:8px">${log.breakExercises.map(b=>`<span class="break-chip">⚡ ${Utils.escape(b.type)}</span>`).join('')}</div>` : ''}
    </div>
  </div>

  <!-- Row 3: Routines + Growth -->
  <div class="grid-2" style="margin-bottom:20px">
    <!-- Routines -->
    <div class="card">
      <div class="card-title">📋 Routines</div>
      <div style="display:flex;gap:16px">
        <div style="flex:1;text-align:center;padding:12px;background:var(--bg2);border-radius:var(--r-sm)">
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">☀️ MORNING</div>
          <div style="font-size:28px;font-weight:900;color:${mDone===mh.length&&mh.length>0?'var(--success)':'var(--text)'}">${mDone}<span style="font-size:16px;color:var(--muted)">/${mh.length}</span></div>
          <div class="progress-bar" style="margin-top:6px"><div class="progress-fill" style="width:${mh.length?Utils.pct(mDone,mh.length):0}%;background:var(--success)"></div></div>
        </div>
        <div style="flex:1;text-align:center;padding:12px;background:var(--bg2);border-radius:var(--r-sm)">
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">🌙 EVENING</div>
          <div style="font-size:28px;font-weight:900;color:${eDone===eh.length&&eh.length>0?'var(--success)':'var(--text)'}">${eDone}<span style="font-size:16px;color:var(--muted)">/${eh.length}</span></div>
          <div class="progress-bar" style="margin-top:6px"><div class="progress-fill" style="width:${eh.length?Utils.pct(eDone,eh.length):0}%;background:var(--primary)"></div></div>
        </div>
      </div>
    </div>

    <!-- Growth -->
    <div class="card">
      <div class="card-title">📚 Growth</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div style="padding:12px;background:var(--bg2);border-radius:var(--r-sm)">
          <div style="font-size:11px;color:var(--muted);font-weight:600">LEARNING</div>
          <div style="font-size:${log.learningMinutes?'22':'13'}px;font-weight:${log.learningMinutes?800:600};margin-top:4px;color:${log.learningMinutes?'var(--text)':'var(--xs)'};">${log.learningMinutes?log.learningMinutes+'<span style="font-size:12px;font-weight:500;color:var(--muted)"> min</span>':'Not logged today'}</div>
          ${log.learningTopic ? `<div style="font-size:11px;color:var(--primary)">${Utils.escape(log.learningTopic)}</div>` : ''}
        </div>
        <div style="padding:12px;background:var(--bg2);border-radius:var(--r-sm)">
          <div style="font-size:11px;color:var(--muted);font-weight:600">READING</div>
          <div style="font-size:${log.readingPages?'22':'13'}px;font-weight:${log.readingPages?800:600};margin-top:4px;color:${log.readingPages?'var(--text)':'var(--xs)'};">${log.readingPages?log.readingPages+'<span style="font-size:12px;font-weight:500;color:var(--muted)"> pages</span>':'Not logged today'}</div>
          ${log.currentBook ? `<div style="font-size:11px;color:var(--primary)">${Utils.escape(log.currentBook.slice(0,20))}...</div>` : ''}
        </div>
      </div>
      <div style="margin-top:10px;padding:8px 12px;background:${log.connection?'var(--success-l)':'var(--bg2)'};border-radius:var(--r-sm);display:flex;align-items:center;gap:8px">
        <span>${log.connection?'✅':'⭕'}</span>
        <span style="font-size:12px;font-weight:600;color:${log.connection?'var(--success)':'var(--muted)'}">Meaningful connection today</span>
      </div>
    </div>
  </div>

  <!-- Habit Streaks -->
  <div class="card" style="margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <div class="card-title" style="margin-bottom:0">🔥 Habit Streaks</div>
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <div style="font-size:10px;color:var(--muted);font-weight:600">consecutive days</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
      ${streakData.map(s=>`
        <div style="text-align:center;padding:14px 10px;background:var(--bg2);border-radius:12px;border:1px solid var(--border)">
          <div style="font-size:22px;margin-bottom:6px">${s.icon}</div>
          <div style="font-size:26px;font-weight:900;color:${s.streak>0?s.color:'var(--xs)'};letter-spacing:-1px;line-height:1">${s.streak}</div>
          <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px">${s.label}</div>
          ${s.streak>0?`<div style="font-size:9px;color:${s.color};font-weight:600;margin-top:3px">${s.streak===1?'Started!':s.streak>=7?'On fire! 🔥':'Keep going!'}</div>`:`<div style="font-size:9px;color:var(--xs);margin-top:3px">Start today</div>`}
        </div>`).join('')}
    </div>
  </div>

  <!-- Tasks -->
  <div class="card" style="margin-bottom:20px">
    <div class="section-header">
      <div><div class="card-title" style="margin-bottom:0">📋 Today's Tasks</div></div>
      <button class="btn btn-primary btn-sm" onclick="showAddTask()">+ Add Task</button>
    </div>

          </div>
          <div style="margin-left:auto;font-size:12px;font-weight:700;color:var(--primary)">Add Task</div>

        ${log.journal?.wentWell ? '📓 View Journal' : '✍️ Write Reflection'}
      </button>

      <div style="font-size:15px;font-weight:700;margin-bottom:4px">📊 Day Completion</div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:14px">
        ${[
          ['💧 Hydration', waterPct, 'var(--info)'],
          ['🏃 Exercise', log.exercises?.length?100:0, 'var(--success)'],
          ['😴 Sleep', log.sleep?100:0, '#8b5cf6'],
          ['🧘 Meditation', log.meditated?100:0, 'var(--primary)'],
        ].map(([l,p,c])=>`
          <div style="display:flex;align-items:center;gap:8px">
            <div style="font-size:10px;color:var(--muted);width:84px;flex-shrink:0">${l}</div>
            <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;width:${p}%;background:${c};border-radius:3px;transition:width .6s ease"></div></div>
            <div style="font-size:10px;font-weight:700;color:${p>=100?c:'var(--muted)'};width:28px;text-align:right">${p >= 100 ? '✓' : p+'%'}</div>
          </div>`).join('')}
      </div>
      <button class="btn btn-ghost btn-sm" onclick="App.navigate('mindset')" style="width:100%">Log Mindset & Mood →</button>
    </div>
  </div>
</div>`;
}

function taskItem(t) {
  const done = t.status === 'completed';
  const pClass = t.priority==='high'?'priority-h':t.priority==='low'?'priority-l':'priority-m';
  return `<div class="task-item ${done?'done':''} ${pClass}" id="task-${t.id}">
    <div class="task-check ${done?'checked':''}" onclick="toggleTask('${t.id}')">${done?'✓':''}</div>
    <div style="flex:1">
      <div class="task-title">${Utils.escape(t.title)}</div>
      <div class="task-meta">${t.category?Utils.escape(t.category)+' · ':''} ${t.dueDate?Utils.fmtDay(t.dueDate)+' · ':''}<span class="tag tag-${t.priority==='high'?'danger':t.priority==='low'?'success':'warn'}">${t.priority||'medium'}</span></div>
    </div>
    <div class="task-actions">
      <button class="btn-icon" onclick="deleteTask('${t.id}')" title="Delete">🗑️</button>
    </div>
  </div>`;
}

const CHECKIN_STEPS = [

let ciStep = 0;

function viewCheckin() {
  ciStep = parseInt(App.state.checkinStep || 0);

}

function renderCheckinStep() {
  const totalSteps = CHECKIN_STEPS.length;
  const progress = CHECKIN_STEPS.map((s,i) => `<div class="wizard-step ${i<ciStep?'done':i===ciStep?'active':''}"></div>`).join('');
  const stepKey = CHECKIN_STEPS[ciStep];
  const stepContent = getStepContent(stepKey);
  return `<div class="anim-fade">
    <div class="page-header">
      <div class="page-title">Daily Check-In</div>
      <div class="page-sub">Step ${ciStep+1} of ${totalSteps} · ${STEP_LABELS[ciStep]}</div>

    <div class="wizard-progress">${progress}</div>
    <div class="card">${stepContent}

        <button class="btn btn-secondary" onclick="ciPrev()" ${ciStep===0?'style="visibility:hidden"':''}>← Back</button>

}

function ciPrev() { if(ciStep > 0) { saveCurrentStep(); ciStep--; App.state.checkinStep=ciStep; document.getElementById('content').innerHTML = renderCheckinStep(); } }
function ciNext() { saveCurrentStep(); if(ciStep < CHECKIN_STEPS.length-1) { ciStep++; App.state.checkinStep=ciStep; document.getElementById('content').innerHTML = renderCheckinStep(); } else { finishCheckin(); } }

function saveCurrentStep() {
  const log = DB.todayLog();
  const key = CHECKIN_STEPS[ciStep];
  const s = DB.settings();
  const g = id => document.getElementById(id);
  const v = id => { const el=g(id); return el?el.value:null; };
  const n = id => { const val=parseFloat(v(id)); return isNaN(val)?null:val; };
  const ni = id => { const val=parseInt(v(id)); return isNaN(val)?null:val; };

  if(key==='weight_sleep'){
    log.weight=n('ci-weight'); log.sleep=n('ci-sleep');
    log.sleepQuality=ni('ci-sleep-q-val'); log.energy=ni('ci-energy');
  } else if(key==='mood_energy'){
    log.mood=ni('ci-mood'); log.stress=ni('ci-stress'); log.focus=ni('ci-focus'); log.mentalClarity=ni('ci-mentalClarity');
    log.gratitude=v('ci-gratitude')||'';
  } else if(key==='water_steps'){
    log.water=ni('ci-water')||0; log.steps=ni('ci-steps'); log.walkDuration=ni('ci-walk');
  } else if(key==='exercise'){
    log.exercised=g('ci-exercised')?.checked||false;
    if(log.exercised){ log.exercises=[{type:v('ci-extype'),duration:ni('ci-exdur'),intensity:v('ci-exint'),notes:v('ci-exnotes'),id:Utils.uid()}]; }
  } else if(key==='meditation'){
    log.meditated=g('ci-meditated')?.checked||false;
    if(log.meditated){ log.meditationDuration=ni('ci-medmin'); log.meditationType=v('ci-medtype'); log.moodBefore=ni('ci-moodb'); log.moodAfter=ni('ci-mooda'); }
  } else if(key==='food'){
    log.foodQuality=ni('ci-foodq'); log.hadJunk=g('ci-junk')?.checked||false; log.foodNotes=v('ci-foodnotes')||'';
  } else if(key==='learning_reading'){
    log.learningMinutes=ni('ci-learnmin'); log.learningTopic=v('ci-learntopic')||'';
    log.readingPages=ni('ci-readpages'); log.currentBook=v('ci-readbook')||''; log.learningTakeaway=v('ci-learntakeaway')||'';
  } else if(key==='relationships'){
    log.connectionNote=v('ci-connote')||''; log.familyTime=g('ci-family')?.checked||false;
  } else if(key==='journal'){
    if(!log.journal) log.journal={};
    log.journal.wentWell=v('ci-jwent')||''; log.journal.didntGoWell=v('ci-jdidnt')||'';
    log.biggestAchievement=v('ci-achieve')||''; log.tomorrowPriority=v('ci-tomorrow')||'';
  }
  const sc = Score.calc(log, s);
  log.score=sc.total; log.scoreBreakdown=sc.breakdown;
  DB.saveTodayLog(log);
}

      <div class="water-btns" style="justify-content:center;margin-top:16px">

        <button class="water-btn" onclick="addWater(2)">+2 Glasses</button>
        <button class="water-btn" onclick="addWaterMl(250)">+250ml</button>

function addWater(n){ const log=DB.getEntryLog(); log.water=(log.water||0)+n; DB.saveEntryLog(log); refreshWaterUI(log.water, DB.settings().waterGoal); App.toast(`+${n} glass${n>1?'es':''}! 💧`); }
function addWaterMl(ml){ const glasses=Math.round(ml/250*10)/10; addWater(Math.ceil(glasses)); }
function setWaterDirect(v){ const log=DB.getEntryLog(); log.water=Math.max(0,v); DB.saveEntryLog(log); refreshWaterUI(log.water, DB.settings().waterGoal); }
function refreshWaterUI(current, goal){ const pct=Utils.pct(current,goal); const c=document.getElementById('water-count'); const p=document.getElementById('water-prog'); const g=document.getElementById('water-glasses'); if(c)c.textContent=current; if(p)p.style.width=pct+'%'; if(g)g.innerHTML=Array.from({length:goal},(_,i)=>`<span class="glass">${i<current?'🥛':'⬜'}</span>`).join(''); }
function setWaterGoalModal(){ showModal('Set Water Goal',`<div class="form-group"><label class="form-label">Daily glasses target</label><input type="number" class="form-control" id="m-watergoal" value="${DB.settings().waterGoal}" min="1" max="20"></div><div style="margin-top:16px;text-align:right"><button class="btn btn-primary" onclick="saveWaterGoal()">Save</button></div>`); }
function saveWaterGoal(){ const v=parseInt(document.getElementById('m-watergoal')?.value); if(v>0){const s=DB.settings();s.waterGoal=v;DB.saveSettings(s);closeModal();App.navigate('water');} }

// ─── ROUTINES ────────────────────────────────────────
function viewRoutine(type) {
  const label = type==='morning'?'☀️ Morning':'🌙 Evening';
  const s = DB.settings();
  const log = DB.getEntryLog();
  const habits = type==='morning' ? s.morningHabits.filter(h=>h.enabled) : s.eveningHabits.filter(h=>h.enabled);
  const done = habits.filter(h=>log[type+'Routine']?.[h.id]).length;
  const pct = habits.length ? Utils.pct(done, habits.length) : 0;
  const allLogs = DB.recentLogs(30);
  const streak = Utils.streak(allLogs, l => {
    const rh = type==='morning' ? s.morningHabits : s.eveningHabits;
    const enabled = rh.filter(h=>h.enabled);
    if(!enabled.length)return false;
    const d = enabled.filter(h=>l[type+'Routine']?.[h.id]).length;
    return d/enabled.length >= 0.7;
  });
  const selDate = App.state.entryDate || Utils.today();
  const isToday = selDate === Utils.today();
  return `<div class="anim-fade">
    <div class="page-header"><div class="page-title">${label} Routine</div></div>
    ${renderDatePicker()}
    ${renderWeekPerf(l=>{ const rh=type==='morning'?s.morningHabits:s.eveningHabits; const en=rh.filter(h=>h.enabled); if(!en.length)return 0; return Math.round(en.filter(h=>l[type+'Routine']?.[h.id]).length/en.length*100); },'Routine Completion','%',type==='morning'?'var(--warn)':'var(--primary)')}
    <div class="card" style="margin-bottom:20px;text-align:center">
      <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">${isToday?"Today's":"Selected Day's"} Progress · ${Utils.fmtDate(selDate)}</div>
      <div class="routine-score" style="color:${pct>=80?'var(--success)':pct>=50?'var(--warn)':'var(--danger)'}">${pct}%</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">${done} of ${habits.length} habits completed</div>
      <div class="progress-bar" style="max-width:300px;margin:0 auto;height:10px"><div class="progress-fill" style="width:${pct}%;background:${type==='morning'?'var(--warn)':'var(--primary)'}"></div></div>
      <div style="margin-top:12px;font-size:13px;color:var(--warn)">🔥 ${streak} day streak</div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="section-header">
        <div class="section-title">Habits</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary btn-sm" onclick="markAllRoutine('${type}',true)">✓ All</button>
          <button class="btn btn-ghost btn-sm" onclick="markAllRoutine('${type}',false)">Clear</button>
        </div>
      </div>
      ${habits.map(h=>`<div class="routine-habit" onclick="toggleRoutineItem('${type}','${h.id}')">
        <div class="routine-check ${log[type+'Routine']?.[h.id]?'done':''}" id="ri-${type}-${h.id}">${log[type+'Routine']?.[h.id]?'✓':''}</div>
        <span class="routine-name">${Utils.escape(h.name)}</span>
      </div>`).join('')}
    </div>
    <div style="text-align:center"><button class="btn btn-secondary" onclick="App.navigate('settings')">⚙️ Customize Habits</button></div>
  </div>`;
}
function toggleRoutineItem(type, id){ const log=DB.getEntryLog(); if(!log[type+'Routine'])log[type+'Routine']={}; log[type+'Routine'][id]=!log[type+'Routine'][id]; DB.saveEntryLog(log); const el=document.getElementById(`ri-${type}-${id}`); if(el){el.className='routine-check'+(log[type+'Routine'][id]?' done':'');el.textContent=log[type+'Routine'][id]?'✓':'';} const s=DB.settings(); const h=type==='morning'?s.morningHabits:s.eveningHabits; const en=h.filter(x=>x.enabled); const done=en.filter(x=>log[type+'Routine']?.[x.id]).length; App.toast(done===en.length&&en.length>0?'🎉 All habits done!':log[type+'Routine'][id]?'✓ Habit completed!':'Habit unchecked'); }
function markAllRoutine(type, v){ const s=DB.settings(); const log=DB.getEntryLog(); const habits=(type==='morning'?s.morningHabits:s.eveningHabits).filter(h=>h.enabled); if(!log[type+'Routine'])log[type+'Routine']={}; habits.forEach(h=>{log[type+'Routine'][h.id]=v;}); DB.saveEntryLog(log); App.navigate(type==='morning'?'morning':'evening'); }

// ─── TASKS ───────────────────────────────────────────
function viewTasks() {
  const filter = App.state.taskFilter || 'today';
  const all = DB.tasks();
  const today = Utils.today();
  let tasks;
  if(filter==='today') tasks = all.filter(t=>t.status!=='completed'&&t.status!=='cancelled'&&(!t.dueDate||t.dueDate===today));
  else if(filter==='overdue') tasks = all.filter(t=>t.status!=='completed'&&t.status!=='cancelled'&&t.dueDate&&t.dueDate<today);
  else if(filter==='upcoming') tasks = all.filter(t=>t.status!=='completed'&&t.status!=='cancelled'&&t.dueDate&&t.dueDate>today);
  else if(filter==='completed') tasks = all.filter(t=>t.status==='completed').slice(-30);
  else tasks = all.filter(t=>t.status!=='cancelled');
  tasks.sort((a,b)=>{ const p={'high':0,'medium':1,'low':2}; return (p[a.priority]||1)-(p[b.priority]||1); });
  const counts = { today:all.filter(t=>t.status!=='completed'&&t.status!=='cancelled'&&(!t.dueDate||t.dueDate===today)).length, overdue:all.filter(t=>t.status!=='completed'&&t.status!=='cancelled'&&t.dueDate&&t.dueDate<today).length, upcoming:all.filter(t=>t.status!=='completed'&&t.status!=='cancelled'&&t.dueDate&&t.dueDate>today).length, completed:all.filter(t=>t.status==='completed').length };
  return `<div class="anim-fade">
    <div class="section-header"><div><div class="page-title">☑️ Tasks</div></div><button class="btn btn-primary" onclick="showAddTask()">+ Add Task</button></div>
    <div style="display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap">
      ${Object.entries({today:'Today',overdue:'Overdue',upcoming:'Upcoming',completed:'Done',all:'All'}).map(([k,l])=>`
        <button class="period-btn ${filter===k?'active':''}" onclick="App.state.taskFilter='${k}';App.navigate('tasks')">${l}${counts[k]?` (${counts[k]})`:''}</button>`).join('')}
    </div>
    ${tasks.length ? tasks.map(t=>taskItemFull(t)).join('') : `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">${filter==='completed'?'No completed tasks yet':'All clear!'}</div><div class="empty-sub">${filter==='today'?'Add tasks for today to get started.':filter==='overdue'?'No overdue tasks!':'Nothing here.'}</div></div>`}
  </div>`;
}
function taskItemFull(t){ const done=t.status==='completed'; const pClass=t.priority==='high'?'priority-h':t.priority==='low'?'priority-l':'priority-m'; return `<div class="task-item ${done?'done':''} ${pClass}" id="task-${t.id}">
  <div class="task-check ${done?'checked':''}" onclick="toggleTask('${t.id}')">${done?'✓':''}</div>
  <div style="flex:1">
    <div class="task-title">${Utils.escape(t.title)}</div>
    <div class="task-meta" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      ${t.category?`<span class="tag tag-muted">${Utils.escape(t.category)}</span>`:''}
      ${t.dueDate?`<span style="font-size:11px;color:${t.dueDate<Utils.today()&&!done?'var(--danger)':'var(--muted)'}">📅 ${Utils.fmtDay(t.dueDate)}</span>`:''}
      <span class="tag tag-${t.priority==='high'?'danger':t.priority==='low'?'success':'warn'}">${t.priority||'medium'}</span>
    </div>
    ${t.notes?`<div style="font-size:11px;color:var(--muted);margin-top:4px">${Utils.escape(t.notes)}</div>`:''}
  </div>
  <div class="task-actions">
    <button class="btn-icon" onclick="editTask('${t.id}')" title="Edit">✏️</button>
    <button class="btn-icon" onclick="deleteTask('${t.id}')" title="Delete">🗑️</button>
  </div>
</div>`; }
function toggleTask(id){ const tasks=DB.tasks(); const t=tasks.find(x=>x.id===id); if(!t)return; t.status=t.status==='completed'?'not_started':'completed'; t.completedAt=t.status==='completed'?Utils.today():null; DB.saveTasks(tasks); const el=document.getElementById(`task-${id}`); if(el){el.classList.toggle('done',t.status==='completed'); const ch=el.querySelector('.task-check'); if(ch){ch.classList.toggle('checked',t.status==='completed');ch.textContent=t.status==='completed'?'✓':'';}} App.toast(t.status==='completed'?'Task completed! ✅':'Task reopened'); }
function deleteTask(id){ if(!confirm('Delete this task?'))return; const tasks=DB.tasks().filter(t=>t.id!==id); DB.saveTasks(tasks); const el=document.getElementById(`task-${id}`); if(el)el.remove(); App.toast('Task deleted'); }

function editTask(id){ const tasks=DB.tasks(); const t=tasks.find(x=>x.id===id); if(!t)return; showModal('Edit Task',`<div class="form-group"><label class="form-label">Task Title</label><input type="text" class="form-control" id="et-title" value="${Utils.escape(t.title)}"></div>

// ─── EXPENSES ─────────────────────────────────────────
const EXPENSE_CATS = ['🍔 Food','🚌 Transport','🛒 Shopping','🎬 Entertainment','💊 Health','🏠 Bills & Rent','📚 Education','✈️ Travel','💇 Personal Care','🎁 Gifts','💼 Business','❓ Other'];

function viewExpenses() {
  const expenses = DB.expenses().sort((a,b)=>b.date.localeCompare(a.date));
  const s = DB.settings();
  const today = Utils.today();
  const now = new Date();
  const monthStr = today.slice(0,7);
  const prevMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevMonthStr = prevMonthDate.toISOString().slice(0,7);

  const thisMonthExp = expenses.filter(e=>e.date.startsWith(monthStr));
  const prevMonthExp = expenses.filter(e=>e.date.startsWith(prevMonthStr));
  const todayExp = expenses.filter(e=>e.date===today);
  const weekStart = new Date(now); weekStart.setDate(now.getDate()-6);
  const weekStr = weekStart.toISOString().slice(0,10);
  const weekExp = expenses.filter(e=>e.date>=weekStr);

  const totalMonth = thisMonthExp.reduce((s,e)=>s+e.amount,0);
  const totalPrevMonth = prevMonthExp.reduce((s,e)=>s+e.amount,0);
  const totalToday = todayExp.reduce((s,e)=>s+e.amount,0);
  const totalWeek = weekExp.reduce((s,e)=>s+e.amount,0);
  const budget = s.expenseBudget || 30000;
  const budgetPct = Math.min(100, Math.round((totalMonth/budget)*100));
  const budgetColor = budgetPct>=90?'var(--danger)':budgetPct>=70?'var(--warn)':'var(--success)';
  const remaining = budget - totalMonth;

  // Category breakdown for this month
  const catMap = {};
  thisMonthExp.forEach(e=>{ const c=e.category||'Other'; catMap[c]=(catMap[c]||0)+e.amount; });
  const catList = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);

  const fmt = v => '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:0});
  const monthName = now.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const diff = totalMonth - totalPrevMonth;
  const diffStr = diff>0?`<span style="color:var(--danger)">↑ ${fmt(Math.abs(diff))} more</span>`:diff<0?`<span style="color:var(--success)">↓ ${fmt(Math.abs(diff))} less</span>`:`<span style="color:var(--muted)">→ Same</span>`;

  return `<div class="anim-fade">
    <div class="page-header">
      <div class="page-title">💰 Expense Tracker</div>
      <div class="page-sub">${monthName}</div>
    </div>

    <!-- Budget Overview -->
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Monthly Spend</div>
          <div style="font-size:36px;font-weight:900;color:${budgetColor}">${fmt(totalMonth)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Budget: ${fmt(budget)} · ${diffStr} vs last month</div>
        </div>
        <button class="btn btn-primary" onclick="showAddExpense()">+ Add</button>
      </div>
      <div class="progress-bar" style="height:12px;margin-bottom:6px"><div class="progress-fill" style="width:${budgetPct}%;background:${budgetColor};transition:width .4s"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)">
        <span>${budgetPct}% used</span>
        <span style="color:${remaining>=0?'var(--success)':'var(--danger)'};font-weight:600">${remaining>=0?fmt(remaining)+' left':fmt(Math.abs(remaining))+' over budget'}</span>
      </div>
    </div>

    <!-- Stats row -->
    <div class="grid-3" style="margin-bottom:16px;gap:10px">
      <div class="card" style="text-align:center;padding:14px">
        <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">TODAY</div>
        <div style="font-size:20px;font-weight:800">${fmt(totalToday)}</div>
        <div style="font-size:11px;color:var(--muted)">${todayExp.length} entries</div>
      </div>
      <div class="card" style="text-align:center;padding:14px">
        <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">THIS WEEK</div>
        <div style="font-size:20px;font-weight:800">${fmt(totalWeek)}</div>
        <div style="font-size:11px;color:var(--muted)">${weekExp.length} entries</div>
      </div>
      <div class="card" style="text-align:center;padding:14px">
        <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">LAST MONTH</div>
        <div style="font-size:20px;font-weight:800">${fmt(totalPrevMonth)}</div>
        <div style="font-size:11px;color:var(--muted)">${prevMonthExp.length} entries</div>
      </div>
    </div>

    <!-- Category Breakdown -->
    ${catList.length>0?`<div class="card" style="margin-bottom:16px">
      <div class="section-header"><div class="section-title">By Category (${monthName})</div></div>
      ${catList.map(([cat,amt])=>{const pct=totalMonth>0?Math.round((amt/totalMonth)*100):0;return `
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span style="font-weight:600">${Utils.escape(cat)}</span>
            <span style="font-weight:700">${fmt(amt)} <span style="color:var(--muted);font-weight:400">(${pct}%)</span></span>
          </div>
          <div class="progress-bar progress-sm"><div class="progress-fill" style="width:${pct}%;background:var(--primary)"></div></div>
        </div>`;}).join('')}
    </div>`:''}

    <!-- Expense List -->
    <div class="card">
      <div class="section-header">
        <div class="section-title">All Expenses</div>
        <div style="display:flex;gap:8px">
          <select class="form-control" style="padding:4px 8px;font-size:12px;width:auto" id="exp-filter" onchange="filterExpenses(this.value)">
            <option value="all">All Time</option>
            <option value="today">Today</option>
            <option value="week">This Week</option>
            <option value="month" selected>This Month</option>
          </select>
        </div>
      </div>
      <div id="exp-list">
        ${renderExpenseList(thisMonthExp)}
      </div>
    </div>

    <!-- Set Budget -->
    <div style="text-align:center;margin-top:16px">
      <button class="btn btn-secondary" onclick="showExpenseBudgetModal()">⚙️ Set Monthly Budget</button>
    </div>
  </div>`;
}

function renderExpenseList(list) {
  if(!list.length) return `<div class="empty-state" style="padding:20px 0"><div class="empty-icon">💸</div><div class="empty-title">No expenses</div><div class="empty-sub">Tap + Add to log your first expense.</div></div>`;
  const fmt = v => '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:0});
  // Group by date
  const byDate = {};
  list.forEach(e=>{ if(!byDate[e.date])byDate[e.date]=[]; byDate[e.date].push(e); });
  return Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,entries])=>{
    const dayTotal = entries.reduce((s,e)=>s+e.amount,0);
    return `<div style="margin-bottom:16px">
