function getCatEmoji(cat) {
  if(!cat)return'💸';
  if(cat.includes('Food'))return'🍔';
  if(cat.includes('Transport'))return'🚌';
  if(cat.includes('Shopping'))return'🛒';
  if(cat.includes('Entertainment'))return'🎬';
  if(cat.includes('Health'))return'💊';
  if(cat.includes('Bills'))return'🏠';
  if(cat.includes('Education'))return'📚';
  if(cat.includes('Travel'))return'✈️';
  if(cat.includes('Personal'))return'💇';
  if(cat.includes('Gift'))return'🎁';
  if(cat.includes('Business'))return'💼';
  return'💸';
}

function filterExpenses(period) {
  const today = Utils.today();
  const now = new Date();
  const monthStr = today.slice(0,7);
  const weekStart = new Date(now); weekStart.setDate(now.getDate()-6);
  const weekStr = weekStart.toISOString().slice(0,10);
  let filtered = DB.expenses().sort((a,b)=>b.date.localeCompare(a.date));
  if(period==='today') filtered = filtered.filter(e=>e.date===today);
  else if(period==='week') filtered = filtered.filter(e=>e.date>=weekStr);
  else if(period==='month') filtered = filtered.filter(e=>e.date.startsWith(monthStr));
  const el = document.getElementById('exp-list');
  if(el) el.innerHTML = renderExpenseList(filtered);
}

    ${habits.length ? `<div>${habits.filter(h=>h.active!==false).map(h=>{const streak=calcHabitStreak(h.id,habitLogs);const doneTod=habitLogs[today]?.[h.id]||false;return`<div class="habit-item"><div class="habit-check ${doneTod?'done':''}" onclick="toggleHabit('${h.id}')">${doneTod?'✓':''}</div><div class="habit-info"><div class="habit-name">${Utils.escape(h.name)}</div><div class="habit-streak">🔥 ${streak} day streak · ${Utils.escape(h.category||'')}</div></div><button class="btn-icon" onclick="deleteHabit('${h.id}')">🗑️</button></div>`;}).join('')}</div>` : `<div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-title">No habits yet</div><div class="empty-sub">Track custom habits beyond routines</div><button class="btn btn-primary mt-3" onclick="showAddHabit()">+ Add First Habit</button></div>`}
  </div>`;
}
function calcHabitStreak(habitId, habitLogs){ let s=0,d=new Date(); for(let i=0;i<365;i++){const key=d.toISOString().slice(0,10);if(habitLogs[key]?.[habitId])s++;else if(i>0)break;d.setDate(d.getDate()-1);} return s; }
function toggleHabit(id){ const logs=DB.habitLogs(); const today=Utils.today(); if(!logs[today])logs[today]={}; logs[today][id]=!logs[today][id]; DB.saveHabitLogs(logs); App.navigate('habits'); App.toast(logs[today][id]?'Habit done! ⚡':'Habit unchecked'); }
function showAddHabit(){ showModal('Add Habit',`<div class="form-group"><label class="form-label">Habit Name *</label><input type="text" class="form-control" id="hb-name" placeholder="e.g. Morning walk"></div><div class="form-row"><div class="form-group"><label class="form-label">Category</label><select class="form-control" id="hb-cat"><option>Health</option><option>Fitness</option><option>Mindset</option><option>Learning</option><option>Productivity</option><option>Other</option></select></div><div class="form-group"><label class="form-label">Frequency</label><select class="form-control" id="hb-freq"><option value="daily">Daily</option><option value="weekly">Weekly</option></select></div></div><div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveHabit()">Add Habit</button></div>`); }
function saveHabit(){ const name=document.getElementById('hb-name')?.value?.trim(); if(!name){App.toast('Enter habit name');return;} const habits=DB.habits(); habits.push({id:Utils.uid(),name,category:document.getElementById('hb-cat')?.value||'',frequency:document.getElementById('hb-freq')?.value||'daily',startDate:Utils.today(),active:true}); DB.saveHabits(habits); closeModal(); App.navigate('habits'); App.toast('Habit added! ⚡'); }
function deleteHabit(id){ if(!confirm('Delete this habit?'))return; DB.saveHabits(DB.habits().filter(h=>h.id!==id)); App.navigate('habits'); }

          <tbody>

    </div>

}

function apSave(id, field, value) {
  const data = DB.actionPlan();
  if (!data[id]) data[id] = {};
  data[id][field] = value.trim();
  DB.saveActionPlan(data);
}

function apExport() {
  const data = DB.actionPlan();
  let csv = '#,Life Goal Area,Work On?,Specific & Measurable,This Month Plan,Deadline,Someday\n';
  ACTION_PLAN_POINTS.forEach(p => {
    const e = data[p.id] || {};
    const esc = v => '"' + (v||'').replace(/"/g,'""') + '"';
    csv += [p.id, esc(p.area), p.workOn, esc(e.specific), esc(e.month), esc(e.deadline), esc(e.someday)].join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'life-action-plan.csv';
  a.click();
  App.toast('Action Plan exported! 📊');
}

  mk('chart-learning','bar',{labels,datasets:[{label:'Learning (min)',data:logs.map(l=>l.learningMinutes||0),backgroundColor:'rgba(99,102,241,.6)'},{label:'Reading (pages)',data:logs.map(l=>l.readingPages||0),backgroundColor:'rgba(245,158,11,.6)'}]});

}

// ─── WEEKLY REVIEW ────────────────────────────────────
function viewWeekly() {
  const today = new Date(); const weekStart = new Date(today); weekStart.setDate(today.getDate()-6);
  const allLogs = DB.allLogs();
  const weekLogs = allLogs.filter(l=>{ const d=new Date(l.date+'T12:00:00'); return d>=weekStart&&d<=today; });
  if(!weekLogs.length) return `<div class="anim-fade"><div class="page-title" style="margin-bottom:20px">📈 Weekly Review</div><div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No data yet</div><div class="empty-sub">Start tracking to see your weekly review</div></div></div>`;
  const s = DB.settings();
  const avgScore = Utils.round1(Utils.avg(weekLogs.filter(l=>l.score).map(l=>l.score)));
  const exerciseDays = weekLogs.filter(l=>l.exercised).length;
  const avgSteps = Utils.round1(Utils.avg(weekLogs.filter(l=>l.steps).map(l=>l.steps)));
  const avgWater = Utils.round1(Utils.avg(weekLogs.map(l=>l.water||0)));
  const avgMood = Utils.round1(Utils.avg(weekLogs.filter(l=>l.mood).map(l=>l.mood)));
  const avgEnergy = Utils.round1(Utils.avg(weekLogs.filter(l=>l.energy).map(l=>l.energy)));
  const meditationDays = weekLogs.filter(l=>l.meditated).length;
  const totalLearning = weekLogs.reduce((s,l)=>s+(l.learningMinutes||0),0);
  const totalReading = weekLogs.reduce((s,l)=>s+(l.readingPages||0),0);
  const connectionDays = weekLogs.filter(l=>l.connection).length;
  const tasks = DB.tasks();
  const weekTasks = tasks.filter(t=>t.completedAt&&t.completedAt>=weekStart.toISOString().slice(0,10));
  const mhEnabled=s.morningHabits.filter(h=>h.enabled); const ehEnabled=s.eveningHabits.filter(h=>h.enabled);
  const avgMorning = mhEnabled.length?Utils.round1(Utils.avg(weekLogs.map(l=>Utils.pct(mhEnabled.filter(h=>l.morningRoutine?.[h.id]).length,mhEnabled.length)))):0;
  const avgEvening = ehEnabled.length?Utils.round1(Utils.avg(weekLogs.map(l=>Utils.pct(ehEnabled.filter(h=>l.eveningRoutine?.[h.id]).length,ehEnabled.length)))):0;
  const breakdown = {health:Utils.round1(Utils.avg(weekLogs.map(l=>l.scoreBreakdown?.health||50))),mindset:Utils.round1(Utils.avg(weekLogs.map(l=>l.scoreBreakdown?.mindset||50))),exercise:Utils.round1(Utils.avg(weekLogs.map(l=>l.scoreBreakdown?.exercise||50))),learning:Utils.round1(Utils.avg(weekLogs.map(l=>l.scoreBreakdown?.learning||50)))};
  const best = Object.entries(breakdown).sort((a,b)=>b[1]-a[1])[0];
  const worst = Object.entries(breakdown).sort((a,b)=>a[1]-b[1])[0];
  return `<div class="anim-fade">
    <div class="page-header"><div class="page-title">📈 Weekly Review</div><div class="page-sub">${Utils.fmtDay(weekStart.toISOString().slice(0,10))} — ${Utils.fmtDay(Utils.today())}</div></div>
    <div class="card" style="text-align:center;margin-bottom:20px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Week's Life Score</div>
      <div class="score-num" style="color:${Score.color(avgScore)}">${avgScore||'—'}</div>
      <div style="font-size:13px;color:var(--muted)">Average · ${weekLogs.length} days tracked</div>
    </div>
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">✅ Best Area</div>
        <div style="font-size:20px;font-weight:800;color:var(--success)">${best[0].replace(/([A-Z])/g,' $1').trim()}</div>
        <div style="font-size:24px;font-weight:900;color:var(--success)">${best[1]}<span style="font-size:14px">/100</span></div>
      </div>
      <div class="card">
        <div class="card-title">⚠️ Needs Attention</div>
        <div style="font-size:20px;font-weight:800;color:var(--warn)">${worst[0].replace(/([A-Z])/g,' $1').trim()}</div>
        <div style="font-size:24px;font-weight:900;color:var(--warn)">${worst[1]}<span style="font-size:14px">/100</span></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">📊 Week Metrics</div>
      ${[['Exercise Days',exerciseDays+' / 7',exerciseDays>=4?'success':exerciseDays>=2?'warn':'danger'],['Avg Steps',avgSteps?avgSteps.toLocaleString():'—',avgSteps>=s.stepGoal?'success':'warn'],['Avg Water',avgWater+' glasses',avgWater>=s.waterGoal?'success':'warn'],['Avg Mood',avgMood+' / 5',avgMood>=4?'success':avgMood>=3?'warn':'danger'],['Avg Energy',avgEnergy+' / 5',avgEnergy>=4?'success':avgEnergy>=3?'warn':'danger'],['Meditation',meditationDays+' days',meditationDays>=5?'success':meditationDays>=3?'warn':'danger'],['Learning',Math.round(totalLearning/60)+'h '+totalLearning%60+'m','primary'],['Reading',totalReading+' pages','primary'],['Connection',connectionDays+' days',connectionDays>=5?'success':'warn'],['Morning Routine',avgMorning+'%',avgMorning>=80?'success':avgMorning>=60?'warn':'danger'],['Evening Routine',avgEvening+'%',avgEvening>=80?'success':avgEvening>=60?'warn':'danger'],['Tasks Done',weekTasks.length,'primary']].map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2)"><span style="font-size:13px;color:var(--muted)">${l}</span><span style="font-size:13px;font-weight:700;color:var(--${c})">${v}</span></div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">💡 Insights & Suggestions</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${avgScore>=80?'<div class="review-area review-good">🎉 Outstanding week! You\'re in excellent form. Keep the momentum going!</div>':avgScore>=65?'<div class="review-area">👍 Good week overall. Some areas have room to grow.</div>':'<div class="review-area review-bad">⚠️ Below your potential this week. Focus on the basics: sleep, water, and movement.</div>'}
        ${exerciseDays<3?'<div class="review-area review-bad">🏃 You exercised only '+exerciseDays+' days this week. Aim for at least 4 days next week.</div>':''}
        ${avgWater<s.waterGoal*0.8?'<div class="review-area review-bad">💧 Your average water intake was below target. Try keeping a water bottle at your desk.</div>':''}
        ${meditationDays<4?'<div class="review-area">🧘 Only '+meditationDays+' meditation sessions this week. Even 5 minutes counts!</div>':''}
        ${connectionDays<3?'<div class="review-area">❤️ Relationship connection was low this week. Reach out to someone important tomorrow.</div>':''}
        <div class="review-area review-good">🎯 Next week, focus on: <strong>${worst[0].replace(/([A-Z])/g,' $1').trim()}</strong></div>
      </div>
    </div>
  </div>`;
}

// ─── MONTHLY REVIEW ───────────────────────────────────
function viewMonthly() {
  const allLogs = DB.allLogs();
  const now = new Date(); const curMonth = now.getMonth(); const curYear = now.getFullYear();
  const prevMonth = curMonth===0?11:curMonth-1; const prevYear = curMonth===0?curYear-1:curYear;
  const curLogs = allLogs.filter(l=>{ const d=new Date(l.date+'T12:00:00'); return d.getMonth()===curMonth&&d.getFullYear()===curYear; });
  const prevLogs = allLogs.filter(l=>{ const d=new Date(l.date+'T12:00:00'); return d.getMonth()===prevMonth&&d.getFullYear()===prevYear; });
  if(!curLogs.length) return `<div class="anim-fade"><div class="page-title" style="margin-bottom:20px">📅 Monthly Review</div><div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No data for this month yet</div><div class="empty-sub">Start tracking to see monthly insights</div></div></div>`;
  const compare = (cur,prev,label,format=(v)=>v,higherBetter=true) => {
    const diff = prev?cur-prev:null; const improved = diff!==null&&(higherBetter?diff>0:diff<0);
    const stable = diff!==null&&Math.abs(diff)<0.5; const arrow = stable?'→':improved?'↑':'↓';
    const color = stable?'var(--muted)':improved?'var(--success)':'var(--danger)';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border2)">
      <span style="font-size:13px;color:var(--muted)">${label}</span>
      <div style="display:flex;align-items:center;gap:8px">
        ${prev!==null?`<span style="font-size:11px;color:var(--muted)">${format(prev)}</span>`:''}
        <span style="font-size:15px;font-weight:800">${format(cur)}</span>
        ${diff!==null?`<span style="color:${color};font-weight:700">${arrow}</span>`:''}
      </div>
    </div>`;
  };
  const avg=(arr,key,filter=(l)=>true)=>{ const vals=arr.filter(filter).map(l=>typeof key==='function'?key(l):l[key]).filter(v=>v!==null&&v!==undefined); return vals.length?Utils.round1(Utils.avg(vals)):null; };
  const curScore=avg(curLogs,'score'); const prevScore=avg(prevLogs,'score');
  const curMood=avg(curLogs,'mood'); const prevMood=avg(prevLogs,'mood');
  const curEnergy=avg(curLogs,'energy'); const prevEnergy=avg(prevLogs,'energy');
  const curSteps=avg(curLogs,'steps',l=>l.steps); const prevSteps=avg(prevLogs,'steps',l=>l.steps);
  const curWater=avg(curLogs,'water'); const prevWater=avg(prevLogs,'water');
  const curLearn=curLogs.reduce((s,l)=>s+(l.learningMinutes||0),0); const prevLearn=prevLogs.reduce((s,l)=>s+(l.learningMinutes||0),0);
  const curRead=curLogs.reduce((s,l)=>s+(l.readingPages||0),0); const prevRead=prevLogs.reduce((s,l)=>s+(l.readingPages||0),0);
  const curExDays=curLogs.filter(l=>l.exercised).length; const prevExDays=prevLogs.filter(l=>l.exercised).length;
  const curMedDays=curLogs.filter(l=>l.meditated).length; const prevMedDays=prevLogs.filter(l=>l.meditated).length;
  const curConnDays=curLogs.filter(l=>l.connection).length; const prevConnDays=prevLogs.filter(l=>l.connection).length;
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `<div class="anim-fade">
    <div class="page-header"><div class="page-title">📅 Monthly Review</div><div class="page-sub">${monthNames[curMonth]} ${curYear} vs ${monthNames[prevMonth]} ${prevYear}</div></div>
    <div class="card" style="text-align:center;margin-bottom:20px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Monthly Avg Score</div>
      <div class="score-num" style="color:${Score.color(curScore||0)}">${curScore||'—'}</div>
      <div style="font-size:13px;color:var(--muted)">${curLogs.length} days tracked</div>
    </div>
    <div class="card">
      <div class="card-title">Month vs Last Month</div>
      ${compare(curScore,prevScore,'Life Score',v=>v?.toFixed(1)||'—')}
      ${compare(curMood,prevMood,'Avg Mood',v=>v?.toFixed(1)+'/5'||'—')}
      ${compare(curEnergy,prevEnergy,'Avg Energy',v=>v?.toFixed(1)+'/5'||'—')}
      ${compare(curSteps,prevSteps,'Avg Steps',v=>v?.toLocaleString()||'—')}
      ${compare(curWater,prevWater,'Avg Water',v=>v?.toFixed(1)+' glasses'||'—')}
      ${compare(curExDays,prevExDays,'Exercise Days',v=>v+' days')}
      ${compare(curMedDays,prevMedDays,'Meditation Days',v=>v+' days')}
      ${compare(curLearn,prevLearn,'Total Learning',v=>Math.round(v/60)+'h')}
      ${compare(curRead,prevRead,'Pages Read',v=>v+' pages')}
      ${compare(curConnDays,prevConnDays,'Connection Days',v=>v+' days')}
    </div>
  </div>`;
}

// ─── CALENDAR ────────────────────────────────────────
function viewCalendar() {
  const now = new Date(); const year=now.getFullYear(); const month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay(); const daysInMonth=new Date(year,month+1,0).getDate();
  const allLogs=DB.allLogs(); const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const getLog=(day)=>{ const d=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; return allLogs.find(l=>l.date===d); };
  const dayNames=['Su','Mo','Tu','We','Th','Fr','Sa'];
  let cells=''; for(let i=0;i<firstDay;i++)cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const log=getLog(d); const isToday=d===now.getDate();
    const bgColor=log?.score?Score.color(log.score):'transparent';
    cells+=`<div style="position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:${isToday?'50%':'8px'};cursor:${log?'pointer':'default'};background:${isToday?'var(--primary)':log?`${bgColor}22`:'transparent'};border:${isToday?'2px solid var(--primary)':'1px solid var(--border2)'}" onclick="${log?`showDayDetail('${log.date}')`:''}" title="${log?'Score: '+(log.score||'—'):''}">
      <span style="font-size:12px;font-weight:${isToday?800:500};color:${isToday?'#fff':log?bgColor:'var(--text)'}">${d}</span>
      ${log?.score?`<span style="font-size:8px;color:${isToday?'rgba(255,255,255,.8)':bgColor}">${log.score}</span>`:''}
      ${log?.exercised?`<span style="font-size:7px" title="Exercised">•</span>`:''}
    </div>`;
  }
  return `<div class="anim-fade">
    <div class="page-header"><div class="page-title">📅 Calendar</div><div class="page-sub">${monthNames[month]} ${year}</div></div>
    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px">
        ${dayNames.map(d=>`<div style="text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
      <div style="display:flex;gap:16px;margin-top:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:12px;border-radius:3px;background:var(--success)"></div><span style="font-size:11px;color:var(--muted)">Good (80+)</span></div>
        <div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:12px;border-radius:3px;background:var(--warn)"></div><span style="font-size:11px;color:var(--muted)">Fair (60-79)</span></div>
        <div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:12px;border-radius:3px;background:var(--danger)"></div><span style="font-size:11px;color:var(--muted)">Poor (&lt;60)</span></div>
      </div>
    </div>
  </div>`;
}
function showDayDetail(date){ const log=DB.logForDate(date); if(!log)return; const s=DB.settings(); showModal(Utils.fmtDate(date),`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
  ${[['Score',log.score,'primary'],['Mood',log.mood+'/5',''],['Energy',log.energy+'/5',''],['Steps',log.steps?.toLocaleString(),''],['Water',log.water+' glasses',''],['Sleep',log.sleep+'h',''],['Exercise',log.exercised?'Yes ✓':'—',''],['Meditation',log.meditated?log.meditationDuration+'min':'—','']].filter(([l,v])=>v&&v!=='—'&&v!=='null/5'&&v!=='undefinedh').map(([l,v,c])=>`<div style="padding:10px;background:var(--bg2);border-radius:var(--r-sm)"><div style="font-size:11px;color:var(--muted)">${l}</div><div style="font-size:16px;font-weight:800;color:${c?'var(--'+c+')':'var(--text)'}">${v||'—'}</div></div>`).join('')}
</div>${log.journal?.wentWell?`<div class="form-group"><label class="form-label">What went well</label><div style="font-size:13px;padding:10px;background:var(--success-l);border-radius:var(--r-sm)">${Utils.escape(log.journal.wentWell)}</div></div>`:''}
<div style="text-align:right;margin-top:12px"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`); }

function saveProfile(){ const s=DB.settings(); s.name=document.getElementById('st-name')?.value?.trim()||s.name; DB.saveSettings(s); App.toast('Profile saved!'); renderNav(); }
function saveTargets(){ const s=DB.settings(); s.stepGoal=parseInt(document.getElementById('st-steps')?.value)||s.stepGoal; s.waterGoal=parseInt(document.getElementById('st-water')?.value)||s.waterGoal; s.exerciseGoal=parseInt(document.getElementById('st-exercise')?.value)||s.exerciseGoal; s.meditationGoal=parseInt(document.getElementById('st-meditation')?.value)||s.meditationGoal; s.readingGoal=parseInt(document.getElementById('st-reading')?.value)||s.readingGoal; s.learningGoal=parseInt(document.getElementById('st-learning')?.value)||s.learningGoal; s.sleepGoal=parseFloat(document.getElementById('st-sleep')?.value)||s.sleepGoal; DB.saveSettings(s); App.toast('Targets saved! ✅'); }
function updateWeightTotal(){ const keys=['health','mindset','exercise','nutrition','morningRoutine','eveningRoutine','learning','relationships','tasks']; const sum=keys.reduce((t,k)=>t+(parseInt(document.getElementById('sw-'+k)?.value)||0),0); const el=document.getElementById('wt-sum'); if(el){el.textContent=sum;el.style.color=sum===100?'var(--success)':'var(--danger)';} }
function saveWeights(){ const keys=['health','mindset','exercise','nutrition','morningRoutine','eveningRoutine','learning','relationships','tasks']; const s=DB.settings(); keys.forEach(k=>{const v=parseInt(document.getElementById('sw-'+k)?.value);if(!isNaN(v))s.scoreWeights[k]=v;}); DB.saveSettings(s); App.toast('Scoring weights saved!'); }
function toggleHabitEnabled(type, id){ const s=DB.settings(); const arr=type==='morning'?s.morningHabits:s.eveningHabits; const h=arr.find(x=>x.id===id); if(h){h.enabled=!h.enabled;DB.saveSettings(s);} }
function showAddRoutineHabit(type){ showModal(`Add ${type==='morning'?'Morning':'Evening'} Habit`,`<div class="form-group"><label class="form-label">Habit Name</label><input type="text" class="form-control" id="arh-name" placeholder="Habit name..."></div><div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addRoutineHabit('${type}')">Add</button></div>`); }
function addRoutineHabit(type){ const name=document.getElementById('arh-name')?.value?.trim(); if(!name){App.toast('Enter habit name');return;} const s=DB.settings(); const arr=type==='morning'?s.morningHabits:s.eveningHabits; arr.push({id:'rh-'+Utils.uid(),name,enabled:true}); DB.saveSettings(s); closeModal(); App.navigate('settings'); App.toast('Habit added!'); }
function exportData(format){ const logs=DB.allLogs(); const tasks=DB.tasks(); const goals=DB.goals(); if(format==='json'){const data=JSON.stringify({logs,tasks,goals,habits:DB.habits(),books:DB.books()},null,2);downloadFile('life-os-data.json',data,'application/json');}else{const rows=[['Date','Score','Mood','Energy','Focus','Stress','Weight','Sleep','Steps','Water','Exercised','Meditation','Learning','Reading','Connection'],...logs.map(l=>[l.date,l.score||'',l.mood||'',l.energy||'',l.focus||'',l.stress||'',l.weight||'',l.sleep||'',l.steps||'',l.water||'',l.exercised?'Yes':'No',l.meditated?l.meditationDuration+'min':'',l.learningMinutes||'',l.readingPages||'',l.connection?'Yes':'No'])];downloadFile('life-os-data.csv',rows.map(r=>r.join(',')).join('\n'),'text/csv');} App.toast(`Data exported as ${format.toUpperCase()}!`); }
function downloadFile(name,content,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); }
function clearAllData(){ if(!confirm('⚠️ This will delete ALL your data permanently. Are you sure?'))return; if(!confirm('Last chance! This cannot be undone. Clear everything?'))return; Object.values(SK).forEach(k=>{if(k===SK.LOG_PREFIX)return;localStorage.removeItem(k);}); Object.keys(localStorage).filter(k=>k.startsWith(SK.LOG_PREFIX)).forEach(k=>localStorage.removeItem(k)); App.navigate('dashboard'); App.toast('All data cleared.'); }

// ─── MODAL SYSTEM ──────────────────────────────────────
function showModal(title, content) {
  document.getElementById('modal-content').innerHTML = `<div class="modal-header"><div class="modal-title">${Utils.escape(title)}</div><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body">${content}</div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

// ─── AUTH / LOCK SCREEN ───────────────────────────────
const Auth = {
  DEFAULT_PWD: 'ravi@2024',
  SESSION_KEY: 'los_unlocked',

  getPassword() {
    return localStorage.getItem(SK.AUTH_PWD) || this.DEFAULT_PWD;
  },

  setPassword(newPwd) {
    localStorage.setItem(SK.AUTH_PWD, newPwd);
  },

  isUnlocked() {
    return sessionStorage.getItem(this.SESSION_KEY) === '1';
  },

  markUnlocked() {
    sessionStorage.setItem(this.SESSION_KEY, '1');
  },

  lock() {
    sessionStorage.removeItem(this.SESSION_KEY);
    document.getElementById('lock-screen').classList.remove('hidden');
    document.getElementById('lock-pwd').value = '';
    document.getElementById('lock-error').textContent = '';
    setTimeout(() => document.getElementById('lock-pwd').focus(), 100);
  },

  unlock() {
    const input = document.getElementById('lock-pwd').value;
    if (input === this.getPassword()) {
      this.markUnlocked();
      const ls = document.getElementById('lock-screen');
      ls.style.opacity = '0';
      ls.style.transition = 'opacity .4s ease';
      setTimeout(() => ls.classList.add('hidden'), 400);
      document.getElementById('lock-error').textContent = '';
    } else {
      const card = document.querySelector('.lock-card');
      card.classList.remove('lock-shake');
      void card.offsetWidth; // reflow
      card.classList.add('lock-shake');
      document.getElementById('lock-error').textContent = '❌ Incorrect password. Try again.';
      document.getElementById('lock-pwd').value = '';
      document.getElementById('lock-pwd').focus();
    }
  },

  init() {
    if (this.isUnlocked()) {
      document.getElementById('lock-screen').classList.add('hidden');
    } else {
      setTimeout(() => document.getElementById('lock-pwd').focus(), 200);
    }
  }
};

function showChangePwdModal() {
  showModal('🔒 Change Password', `
    <div class="form-group"><label class="form-label">Current Password</label><input type="password" class="form-control" id="cp-old" placeholder="Current password"></div>
    <div class="form-group" style="margin-top:12px"><label class="form-label">New Password</label><input type="password" class="form-control" id="cp-new" placeholder="New password (min 4 chars)"></div>
    <div class="form-group" style="margin-top:12px"><label class="form-label">Confirm New Password</label><input type="password" class="form-control" id="cp-confirm" placeholder="Confirm new password"></div>
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewPassword()">Save Password</button>
    </div>
  `);
}

function saveNewPassword() {
  const oldPwd = document.getElementById('cp-old')?.value;
  const newPwd = document.getElementById('cp-new')?.value;
  const confirm = document.getElementById('cp-confirm')?.value;
  if (oldPwd !== Auth.getPassword()) { App.toast('❌ Current password is wrong'); return; }
  if (!newPwd || newPwd.length < 4) { App.toast('Password must be at least 4 characters'); return; }
  if (newPwd !== confirm) { App.toast('❌ Passwords do not match'); return; }
  Auth.setPassword(newPwd);
  closeModal();
  App.toast('✅ Password changed successfully!');
}

// ─── APP OBJECT ───────────────────────────────────────

  state: { view:'dashboard', checkinStep:0, taskFilter:'today', analyticsPeriod:30, entryDate: null },

  navigate(view) {
    destroyCharts();
    this.state.view = view;
    const titles = {dashboard:'Dashboard',checkin:'Daily Check-In',analytics:'Analytics',calendar:'Calendar',health:'Health',water:'Water',exercise:'Exercise',meditation:'Meditation',morning:'Morning Routine',evening:'Evening Routine',mindset:'Mindset',learning:'Learning',reading:'Reading',relationships:'Relationships',food:'Food & Nutrition',tasks:'Tasks',journal:'Daily Journal',goals:'Goals',habits:'Habits',weekly:'Weekly Review',monthly:'Monthly Review',settings:'Settings',more:'More'};
    document.getElementById('topbar-title').textContent = titles[view]||'Life OS';
    const content = document.getElementById('content');
    content.innerHTML = '';
    content.scrollTop = 0;
    content.innerHTML = this.renderView(view);
    renderNav();
    this.updateBottomNav(view);
    window.scrollTo(0,0);
    // Init charts after render
    if(view==='analytics') setTimeout(initAnalyticsCharts, 100);
    if(view==='health') setTimeout(()=>initAnalyticsCharts(), 100);
    // Close sidebar on mobile
    this.closeSidebar();
  },

  renderView(view) {
    switch(view) {
      case 'dashboard': return viewDashboard();
      case 'checkin': return viewCheckin();
      case 'water': return viewWater();
      case 'exercise': return viewExercise();
      case 'morning': return viewRoutine('morning');
      case 'evening': return viewRoutine('evening');
      case 'mindset': return viewMindset();
      case 'meditation': return viewMeditation();
      case 'tasks': return viewTasks();
      case 'journal': return viewJournal();
      case 'food': return viewFood();
      case 'expenses': return viewExpenses();
      case 'learning': return viewLearning();
      case 'reading': return viewReading();
      case 'relationships': return viewRelationships();
      case 'goals': return viewGoals();
      case 'habits': return viewHabits();
      case 'actionplan': return viewActionPlan();
      case 'health': return viewHealth();
      case 'analytics': return viewAnalytics();
      case 'weekly': return viewWeekly();
      case 'monthly': return viewMonthly();
      case 'calendar': return viewCalendar();
      case 'settings': return viewSettings();
      case 'more': return viewMore();
      default: return `<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-title">Coming Soon</div><div class="empty-sub">This module is under development.</div></div>`;
    }
  },

  updateBottomNav(view) {
    document.querySelectorAll('.bnav-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-view')===view);
    });
  },

  openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-overlay').classList.add('open');
  },

  closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  },

  toggleTheme() {
    const curr = document.documentElement.getAttribute('data-theme')||'light';
    const next = curr==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', next);
    const s = DB.settings(); s.theme = next; DB.saveSettings(s);
    destroyCharts();
    if(this.state.view==='analytics'||this.state.view==='health') setTimeout(initAnalyticsCharts,100);
  },

  toast(msg, duration=2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(()=>t.classList.remove('show'), duration);
  },

  init() {
    // Auth check — show lock screen if not unlocked
    Auth.init();

    // Apply saved theme
    const s = DB.settings();
    document.documentElement.setAttribute('data-theme', s.theme||'light');

    // Build sidebar
    renderNav();

    // Setup modal close on overlay click
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if(e.target===document.getElementById('modal-overlay')) closeModal();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if(e.key==='Escape') closeModal();
      if(e.ctrlKey||e.metaKey) {
        if(e.key==='d'){e.preventDefault();App.navigate('dashboard');}
        if(e.key==='k'){e.preventDefault();App.navigate('checkin');}
        if(e.key==='t'){e.preventDefault();App.navigate('tasks');}
      }
    });

    // Navigate to dashboard
    this.navigate('dashboard');
  }
};

// ─── ANIMATION ENGINE ──────────────────────────────────────
const Anim = {
  // Animate numeric value counting up
  counter(el, target, duration=900, suffix='') {
    const start = performance.now();
    const update = (now) => {
      const t = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      const val = Math.round(target * ease);
      el.textContent = (val >= 1000 ? val.toLocaleString() : val) + suffix;
      if (t < 1) requestAnimationFrame(update);
    };
    requestAnimationFrame(update);
  },

  // Animate all [data-count] elements in the DOM
  counters() {
    document.querySelectorAll('[data-count]').forEach(el => {
      const target = parseFloat(el.getAttribute('data-count')) || 0;
      const suffix = el.getAttribute('data-suffix') || '';
      this.counter(el, target, 850, suffix);
    });
  },

  // Animate progress bars from 0 → target width
  progressBars() {
    document.querySelectorAll('.progress-fill, .stat-fill').forEach(bar => {
      const w = bar.style.width;
      if (!w || w === '0%' || w === '0') return;
      bar.style.width = '0';
      bar.style.transition = 'none';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          bar.style.transition = 'width .85s cubic-bezier(.16,1,.3,1)';
          bar.style.width = w;
        });
      });
    });
  },

  // Ripple effect on button click
  ripple(e) {
    const btn = e.currentTarget;
    const r = btn.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2.2;
    const el = document.createElement('span');
    el.className = 'ripple-el';
    el.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size/2}px;top:${e.clientY - r.top - size/2}px;`;
    btn.appendChild(el);
    setTimeout(() => el.remove(), 700);
  },

  // Wire up all ripple targets
  ripples() {
    document.querySelectorAll('.btn-primary,.btn-success,.btn-danger,.quick-btn,.lock-btn').forEach(btn => {
      btn.removeEventListener('click', this._rippleHandler);
      this._rippleHandler = (e) => this.ripple(e);
      btn.addEventListener('click', this._rippleHandler);
    });
  },

  // Stagger-animate child elements
  stagger(selector, delay=60) {
    document.querySelectorAll(selector).forEach((el, i) => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(16px)';
      el.style.transition = 'opacity .35s ease, transform .35s ease';
      setTimeout(() => {
        el.style.opacity = '';
        el.style.transform = '';
      }, i * delay + 40);
    });
  },

  // SVG score ring
  scoreRing(score) {
    const ring = document.querySelector('.score-ring-fill');
    if (!ring) return;
    const circumference = 283;
    const offset = circumference - (score / 100) * circumference;
    ring.style.setProperty('--dash', offset);
  },

  // Run all on page change
  all(view) {
    setTimeout(() => {
      this.counters();
      this.progressBars();
      this.ripples();
      if (view === 'dashboard') {
        const scoreEl = document.querySelector('.score-num');
        if (scoreEl) {
          const score = parseInt(scoreEl.textContent) || 0;
          this.scoreRing(score);
        }
        // Stagger stat cards
        this.stagger('.stat-card', 55);
        this.stagger('.quick-btn', 35);
      }
    }, 40);
  }
};

// Patch App.navigate to run animations after every page render
(function() {
  const orig = App.navigate.bind(App);
  App.navigate = function(view) {
    orig(view);
    Anim.all(view);
    updateGlobalDateDisplay();
  };
})();

// Start the app
window.addEventListener('DOMContentLoaded', () => { App.init(); updateGlobalDateDisplay(); });
